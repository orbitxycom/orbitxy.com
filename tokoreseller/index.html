<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Toko Reseller — orbitxy.com</title>
<style>
  :root{
    --bg:#0a0a0d;
    --card:#17151c;
    --card2:#1c1a22;
    --purple:#8b5cf6;
    --purple2:#a855f7;
    --purple-dark:#3b2560;
    --yellow:#ffc518;
    --yellow2:#ffd84d;
    --text:#ffffff;
    --muted:#8b889a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    overflow:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse 120% 60% at 50% 32%, rgba(139,92,246,0.20), transparent 65%),
      var(--bg);
  }
  .app{
    width:100%;
    max-width:520px;
    margin:0 auto;
    height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }
  .main-content{
    flex:1;
    width:100%;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding:14px 14px 0 14px;
  }

  /* ---------- HEADER ---------- */
  .header{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
  }
  .profile-pill{
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
    background:#111212;
    border:1px solid #252626;
    border-radius:24px;
    height:54px;
    padding:0 16px 0 6px;
    min-width:0;
  }
  .avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:linear-gradient(160deg,#ffb454,#ff8a3d);
    flex-shrink:0;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.08);
  }
  .avatar svg{position:absolute;top:2px;left:6px;width:30px;height:39px;}
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;position:relative;z-index:1;}
  .username{
    font-size:17px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chevron{
    color:var(--muted);
    font-size:17px;
    margin-left:auto;
    flex-shrink:0;
  }
  .icon-btn{
    width:44px;
    height:44px;
    border-radius:16px;
    background:#111212;
    border:1px solid #252626;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    font-size:14px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .icon-btn:active{transform:scale(0.90);background:#201d26;}
  .icon-btn.lang{width:44px;height:44px;padding:0;border-radius:16px;}

  /* ---------- DAILY LIMIT CARD ---------- */
  .daily-card{
    background:linear-gradient(180deg,#18151d,#141218);
    border:1px solid #24202b;
    border-radius:26px;
    padding:16px 18px;
    margin-bottom:18px;
  }
  .daily-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .daily-label{
    display:flex;
    align-items:center;
    gap:4px;
    color:#b9b6c2;
    font-size:14px;
    font-weight:500;
  }
  .daily-label .chev{font-size:13px;color:#7a7784;}
  .balance-label{
    color:#b9b6c2;
    font-size:14px;
    font-weight:500;
  }
  .daily-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
  }
  .daily-value, .balance-value{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:22px;
    font-weight:700;
  }
  .balance-value{color:var(--yellow);}
  .lightning-badge{
    width:26px;
    height:26px;
    border-radius:8px;
    background:#241a35;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .coin-badge{
    width:24px;
    height:24px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffe27a, #ffb400);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  /* ---------- LEVEL RING ---------- */
  .level-wrap{
    display:flex;
    justify-content:center;
    margin:6px 0 6px 0;
    position:relative;
  }
  .ring-box{
    width:200px;
    height:200px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ring-box svg{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    transform:rotate(-90deg);
    filter:drop-shadow(0 0 10px rgba(168,85,247,0.45));
  }
  .ring-center{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:2;
  }
  .lvl-label{
    font-size:15px;
    color:#c9c6d3;
    font-weight:500;
    letter-spacing:0.5px;
  }
  .lvl-number{
    font-size:44px;
    font-weight:800;
    line-height:1;
    margin-top:2px;
  }
  .lvl-pill{
    position:absolute;
    bottom:-6px;
    background:linear-gradient(180deg,#9d5cf5,#7c3aed);
    padding:6px 16px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:4px;
    box-shadow:0 4px 14px rgba(124,58,237,0.5);
    cursor:pointer;
    user-select:none;
  }
  .lvl-pill .fade{color:rgba(255,255,255,0.55);}

  /* ---------- CHARACTERS ---------- */
  .characters{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:2px;
    margin:8px 0 14px 0;
    min-height:190px;
  }
  .characters svg{
    filter:drop-shadow(0 12px 18px rgba(0,0,0,0.55));
  }
  .cat-char{width:150px;height:180px;}
  .penguin-char{width:130px;height:180px;margin-left:-14px;}

  /* ---------- CLAIM BUTTON ---------- */
  .claim-btn{
    width:100%;
    background:linear-gradient(180deg,var(--yellow2),var(--yellow));
    border-radius:30px;
    padding:8px;
    display:flex;
    align-items:center;
    gap:10px;
    border:none;
    cursor:pointer;
    margin-bottom:14px;
    box-shadow:0 8px 20px rgba(255,197,24,0.25);
    transition:transform .12s ease;
  }
  .claim-btn:active{transform:scale(0.97);}
  .timer-circle{
    width:56px;
    height:56px;
    border-radius:50%;
    background:rgba(0,0,0,0.18);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .timer-circle svg{width:16px;height:16px;margin-bottom:1px;}
  .timer-text{
    font-size:11px;
    font-weight:700;
    color:#3a2c00;
  }
  .claim-text{
    flex:1;
    text-align:center;
    font-size:21px;
    font-weight:800;
    color:#1a1200;
    padding-right:56px;
  }
  .claim-text span{
    font-weight:700;
    color:#5c4a12;
    opacity:0.75;
    margin-left:6px;
  }

  /* ---------- BANNER ---------- */
  .banner{
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg,#8b3fe0,#7c3aed 60%,#a855f7);
    border-radius:24px;
    padding:20px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:112px;
  }
  .banner .bg-pattern{
    position:absolute;
    inset:0;
    opacity:0.18;
    background-image:
      linear-gradient(45deg, transparent 45%, #fff 45%, #fff 55%, transparent 55%),
      linear-gradient(-45deg, transparent 45%, #fff 45%, #fff 55%, transparent 55%);
    background-size:34px 34px;
  }
  .banner-text{position:relative;z-index:2;}
  .banner-text .l1{
    font-size:21px;
    font-weight:800;
    line-height:1.15;
  }
  .banner-text .l2{
    font-size:21px;
    font-weight:800;
    line-height:1.15;
  }
  .banner-text .l3{
    font-size:12.5px;
    font-weight:600;
    color:rgba(255,255,255,0.85);
    margin-top:8px;
    letter-spacing:0.3px;
  }
  .banner-claim{
    position:relative;
    z-index:2;
    background:linear-gradient(180deg,var(--yellow2),var(--yellow));
    color:#1a1200;
    font-size:14px;
    font-weight:800;
    border:none;
    padding:12px 22px;
    border-radius:18px;
    cursor:pointer;
    flex-shrink:0;
    transition:transform .12s ease;
  }
  .banner-claim:active{transform:scale(0.93);}

  /* ---------- BOTTOM NAV ---------- */
  .content-bottom-space{height:96px;}
  .bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    width:100%;
    max-width:520px;
    margin:0 auto;
    background:#0c0b0f;
    border-top:1px solid #201e26;
    display:flex;
    padding:10px 4px calc(10px + env(safe-area-inset-bottom,0px)) 4px;
    z-index:50;
  }
  .nav-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:var(--muted);
    cursor:pointer;
    font-size:11px;
    font-weight:600;
    padding:4px 0;
    transition:color .15s ease;
    -webkit-user-select:none;
    user-select:none;
  }
  .nav-item svg{width:22px;height:22px;transition:transform .15s ease;}
  .nav-item.active{color:var(--purple2);}
  .nav-item.active svg{transform:translateY(-1px);}
  .nav-item:active svg{transform:scale(0.85);}
  .nav-indicator{
    position:absolute;
    top:0;
    height:2px;
    background:var(--purple2);
    border-radius:2px;
    transition:left .25s ease, width .25s ease;
  }
  .bottom-nav{position:fixed;}

  /* ---------- TOKO ANDA (panel admin) ---------- */
  .ta-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
  }
  .ta-store-name{
    font-size:19px;
    font-weight:800;
    letter-spacing:.02em;
    text-transform:uppercase;
  }
  .ta-store-url{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
    word-break:break-all;
  }
  .ta-logout-btn{
    flex-shrink:0;
    background:#1c1a22;
    border:1px solid #2a2732;
    color:#9c98a8;
    font-size:12.5px;
    font-weight:600;
    padding:8px 16px;
    border-radius:14px;
    cursor:pointer;
  }
  .ta-logout-btn:active{transform:scale(.95);}

  .ta-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:16px;
  }
  .ta-stat-card{
    background:#151318;
    border:1px solid #232028;
    border-radius:16px;
    padding:12px 12px 14px;
    min-width:0;
  }
  .ta-stat-label{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:#77748a;
    margin-bottom:6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .ta-stat-value{
    font-size:17px;
    font-weight:800;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .ta-stat-card:first-child .ta-stat-value{color:#34d399;}

  .ta-tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:14px;
    scrollbar-width:none;
  }
  .ta-tabs::-webkit-scrollbar{display:none}
  .ta-tab{
    flex-shrink:0;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    padding:9px 18px;
    border-radius:18px;
    border:1px solid #2a2732;
    background:#17151c;
    color:#8b889a;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .ta-tab.active{
    background:linear-gradient(180deg,#34d399,#10b981);
    border-color:#10b981;
    color:#062e22;
  }

  .ta-add-btn{
    width:100%;
    background:linear-gradient(180deg,#34d399,#10b981);
    border:none;
    color:#062e22;
    font-size:15px;
    font-weight:800;
    padding:15px;
    border-radius:16px;
    cursor:pointer;
    margin-bottom:20px;
    box-shadow:0 8px 20px rgba(16,185,129,0.22);
    transition:transform .12s ease;
  }
  .ta-add-btn:active{transform:scale(.97);}

  .ta-empty{
    text-align:center;
    font-size:13.5px;
    color:#6f6c7d;
    padding:40px 20px;
  }

  /* Kartu produk reseller */
  .rp-card{
    display:flex;
    gap:12px;
    align-items:center;
    background:#151318;
    border:1px solid #232028;
    border-radius:16px;
    padding:10px;
    margin-bottom:10px;
  }
  .rp-thumb{
    width:56px;height:56px;
    border-radius:12px;
    object-fit:cover;
    background:#1e1b25;
    flex-shrink:0;
  }
  .rp-thumb-placeholder{
    width:56px;height:56px;
    border-radius:12px;
    background:#1e1b25;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:#4a4656;
  }
  .rp-info{flex:1;min-width:0;}
  .rp-name{
    font-size:14px;font-weight:700;color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:2px;
  }
  .rp-price{font-size:13px;font-weight:800;color:#34d399;}
  .rp-stock{font-size:11px;color:#6f6c7d;margin-top:2px;}
  .rp-del{
    flex-shrink:0;
    width:32px;height:32px;
    border-radius:10px;
    background:rgba(248,113,113,.1);
    border:1px solid rgba(248,113,113,.2);
    color:#f87171;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .rp-del svg{width:15px;height:15px;}
  .rp-del:active{transform:scale(.9);}

  /* List chat masuk (tab Chat di Toko Anda) */
  .chat-item{
    display:flex;gap:10px;align-items:center;
    background:#151318;border:1px solid #232028;border-radius:14px;
    padding:11px 12px;margin-bottom:8px;cursor:pointer;
  }
  .chat-item:active{transform:scale(.98);}
  .chat-avatar{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(160deg,#8b5cf6,#6d28d9);
    display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:800;color:#fff;
  }
  .chat-info{flex:1;min-width:0;}
  .chat-name{font-size:.8rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-last{font-size:.68rem;color:#77748a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .chat-time{font-size:.6rem;color:#5f5c6c;flex-shrink:0;}

  /* Bottom sheet: form tambah produk */
  .pf-overlay{
    position:fixed;inset:0;z-index:900;
    background:rgba(0,0,0,.65);
    opacity:0;pointer-events:none;
    transition:opacity .22s;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .pf-overlay.on{opacity:1;pointer-events:auto;}
  .pf-sheet{
    width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
    background:#111015;
    border:1px solid #232028;border-bottom:none;
    border-radius:22px 22px 0 0;
    padding:.6rem 20px calc(1.2rem + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
  }
  .pf-overlay.on .pf-sheet{transform:translateY(0);}
  .pf-handle{width:36px;height:4px;border-radius:2px;background:#2a2732;margin:.5rem auto 1rem;}
  .pf-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
  .pf-title{font-size:16px;font-weight:800;}
  .pf-close{width:30px;height:30px;border-radius:50%;background:#1c1a22;border:1px solid #2a2732;color:#9c98a8;cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;}
  .pf-field{margin-bottom:14px;}
  .pf-row{display:flex;gap:10px;}
  .pf-lbl{font-size:12px;font-weight:700;color:#9c98a8;margin-bottom:6px;display:block;}
  .pf-opt{font-weight:500;color:#5f5c6c;text-transform:none;}
  .pf-inp{
    width:100%;background:#1a1820;border:1px solid #2a2732;border-radius:12px;
    padding:11px 13px;color:#fff;font-family:inherit;font-size:14px;outline:none;
    transition:border-color .15s;
  }
  .pf-inp:focus{border-color:#34d399;}
  .pf-inp::placeholder{color:#4a4656;}

  /* Tab TOKO — grid produk dari semua reseller (gaya kartu seperti dashboard) */
  .tk-title{font-size:20px;font-weight:800;margin:4px 0 14px;}
  .tk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .tk-card{
    background:#151318;
    border:1px solid #232028;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    transition:border-color .15s,transform .15s;
  }
  .tk-card:active{transform:scale(.97);}
  .tk-thumb{
    aspect-ratio:1/1;
    background:#1e1b25;
    display:flex;align-items:center;justify-content:center;
    color:#4a4656;
    overflow:hidden;
  }
  .tk-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .tk-body{padding:10px 11px 12px;}
  .tk-name{
    font-size:13px;font-weight:700;color:#fff;line-height:1.3;
    margin-bottom:5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:2.6em;
  }
  .tk-price{font-size:13.5px;font-weight:800;color:#a855f7;}
  .tk-stock{font-size:10.5px;color:#6f6c7d;margin-top:3px;}
  .tk-skel{
    aspect-ratio:.78;
    border-radius:16px;
    background:linear-gradient(90deg,#151318 25%,#1c1a22 50%,#151318 75%);
    background-size:400% 100%;
    animation:_tkShimmer 1.5s ease infinite;
  }
  @keyframes _tkShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="app">
<div class="main-content">

  <!-- ============ VIEW: TOKO (produk dari SEMUA reseller, kelihatan buat semua akun) ============ -->
  <div id="viewToko" class="view">

    <div class="tk-title">Produk</div>
    <div class="tk-grid" id="tokoGrid">
      <div class="tk-skel"></div><div class="tk-skel"></div>
      <div class="tk-skel"></div><div class="tk-skel"></div>
    </div>
    <div class="ta-empty" id="tokoEmpty" style="display:none">Belum ada produk dari reseller manapun.</div>

  </div>
  <!-- ============ /VIEW: TOKO ============ -->

  <!-- ============ VIEW: TOKO ANDA (panel admin toko reseller) ============ -->
  <div id="viewTokoAnda" class="view" style="display:none">

    <div class="ta-header">
      <div>
        <div class="ta-store-name" id="taStoreName">TOKO SAYA</div>
        <div class="ta-store-url" id="taStoreUrl">https://orbitxy.com/toko/…</div>
      </div>
      <button class="ta-logout-btn" id="taLogoutBtn">Keluar</button>
    </div>

    <div class="ta-stats">
      <div class="ta-stat-card">
        <div class="ta-stat-label">Saldo</div>
        <div class="ta-stat-value" id="taSaldo">Rp0</div>
      </div>
      <div class="ta-stat-card">
        <div class="ta-stat-label">Total Cuan</div>
        <div class="ta-stat-value" id="taCuan">Rp0</div>
      </div>
      <div class="ta-stat-card">
        <div class="ta-stat-label">Order</div>
        <div class="ta-stat-value" id="taOrder">0</div>
      </div>
    </div>

    <div class="ta-tabs" id="taTabs">
      <button class="ta-tab active" data-tab="produk">Produk</button>
      <button class="ta-tab" data-tab="pesanan">Pesanan</button>
      <button class="ta-tab" data-tab="chat">Chat</button>
      <button class="ta-tab" data-tab="banner">Banner</button>
      <button class="ta-tab" data-tab="pengaturan">Pengaturan</button>
    </div>

    <!-- Tab: Produk -->
    <div class="ta-panel" id="taPanelProduk">
      <button class="ta-add-btn" id="taAddProdukBtn">+ Tambah Produk</button>
      <div id="taProdukList"></div>
      <div class="ta-empty" id="taProdukEmpty" style="display:none">Belum ada produk. Klik "Tambah Produk".</div>
    </div>

    <!-- Tab: Pesanan -->
    <div class="ta-panel" id="taPanelPesanan" style="display:none">
      <div class="ta-empty">Belum ada pesanan masuk.</div>
    </div>

    <!-- Tab: Chat -->
    <div class="ta-panel" id="taPanelChat" style="display:none">
      <div id="taChatList"></div>
      <div class="ta-empty" id="taChatEmpty" style="display:none">Belum ada percakapan.</div>
    </div>

    <!-- Tab: Banner -->
    <div class="ta-panel" id="taPanelBanner" style="display:none">
      <button class="ta-add-btn" id="taAddBannerBtn">+ Tambah Banner</button>
      <div class="ta-empty">Belum ada banner.</div>
    </div>

    <!-- Tab: Pengaturan -->
    <div class="ta-panel" id="taPanelPengaturan" style="display:none">
      <div class="ta-empty">Pengaturan toko akan segera hadir.</div>
    </div>

  </div>
  <!-- ============ /VIEW: TOKO ANDA ============ -->

  <!-- ============ BOTTOM SHEET: Tambah Produk ============ -->
  <div class="pf-overlay" id="pfOverlay" onclick="if(event.target===this)closeProdukForm()">
    <div class="pf-sheet">
      <div class="pf-handle"></div>
      <div class="pf-head">
        <div class="pf-title">Tambah Produk</div>
        <button class="pf-close" onclick="closeProdukForm()">&#10005;</button>
      </div>

      <div class="pf-field">
        <label class="pf-lbl">Nama Produk</label>
        <input type="text" id="pfName" class="pf-inp" placeholder="Contoh: Akun Premium 1 Bulan" maxlength="120">
      </div>
      <div class="pf-row">
        <div class="pf-field" style="flex:1">
          <label class="pf-lbl">Harga (Rp)</label>
          <input type="number" id="pfPrice" class="pf-inp" placeholder="15000" min="0" inputmode="numeric">
        </div>
        <div class="pf-field" style="flex:1">
          <label class="pf-lbl">Stok <span class="pf-opt">(kosongkan = unlimited)</span></label>
          <input type="number" id="pfStock" class="pf-inp" placeholder="Unlimited" min="0" inputmode="numeric">
        </div>
      </div>
      <div class="pf-field">
        <label class="pf-lbl">URL Gambar <span class="pf-opt">(opsional)</span></label>
        <input type="text" id="pfThumb" class="pf-inp" placeholder="https://...">
      </div>
      <div class="pf-field">
        <label class="pf-lbl">Deskripsi <span class="pf-opt">(opsional)</span></label>
        <textarea id="pfDesc" class="pf-inp" style="min-height:70px;resize:vertical" placeholder="Deskripsi singkat produk"></textarea>
      </div>

      <button class="ta-add-btn" id="pfSubmitBtn" style="margin-bottom:0" onclick="submitProduk()">Simpan Produk</button>
    </div>
  </div>

  <div class="content-bottom-space"></div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav" id="bottomNav">
    <div class="nav-indicator" id="navIndicator"></div>
    <div class="nav-item active" data-nav="toko">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span>Toko</span>
    </div>
    <div class="nav-item" data-nav="toko-anda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
      <span>Toko Anda</span>
    </div>
  </nav>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/chat-widget.js"></script>
<script>
'use strict';

var supabaseClient;
try{
  supabaseClient = supabase.createClient(
    'https://ygjpwaftccewntwwoixs.supabase.co',
    'sb_publishable_4IdyoPpEW-It9IWLZOrSAQ_WuumXkl9'
  );
}catch(e){ console.error('Gagal memuat Supabase:', e); }

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');}

// Ambil nama depan dari akun Google/Gmail yang login.
// Urutan prioritas: nama lengkap dari Google -> bagian sebelum @ di email -> "Pengguna"
function getFirstNameFromUser(user){
  if(!user) return 'Pengguna';
  var meta = user.user_metadata || {};
  var fullName = meta.full_name || meta.name || '';
  if(fullName){
    return fullName.trim().split(' ')[0];
  }
  if(user.email){
    return user.email.split('@')[0];
  }
  return 'Pengguna';
}

async function initAuth(){
  if(!supabaseClient){
    document.getElementById('usernameEl').textContent = 'Pengguna';
    return;
  }

  var { data } = await supabaseClient.auth.getUser();
  var user = data ? data.user : null;

  if(!user){
    window.location.href = '/login/?returnUrl=' + encodeURIComponent('/tokoreseller/');
    return;
  }

  var firstName = getFirstNameFromUser(user);
  document.getElementById('usernameEl').textContent = firstName;
  document.getElementById('usernameEl').title = firstName;

  // Kalau ada foto profil dari Google, pasang jadi avatar (opsional, avatar
  // default tetap dipakai kalau foto gak ada)
  var avatarUrl = (user.user_metadata && (user.user_metadata.avatar_url || user.user_metadata.picture)) || '';
  if(avatarUrl){
    var box = document.getElementById('avatarBox');
    var img = document.createElement('img');
    img.src = avatarUrl;
    img.alt = firstName;
    img.onerror = function(){ img.remove(); }; // fallback ke ikon default kalau gagal load
    box.appendChild(img);
  }

  // Isi nama toko & URL di panel "Toko Anda" berdasarkan nama akun.
  // (slug URL ini masih placeholder, nanti disambungkan ke sistem toko beneran)
  var storeSlug = firstName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'toko';
  var taName = document.getElementById('taStoreName');
  var taUrl = document.getElementById('taStoreUrl');
  if(taName) taName.textContent = firstName.toUpperCase() + ' STORE';
  if(taUrl) taUrl.textContent = 'https://orbitxy.com/toko/' + storeSlug;
}
initAuth();

/* ── Produk milik reseller: load, tambah, hapus ───────────── */
function idr(n){var v=Number(n);if(!isFinite(v)||isNaN(v))v=0;return 'Rp'+v.toLocaleString('id-ID');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');}

function openProdukForm(){
  document.getElementById('pfName').value = '';
  document.getElementById('pfPrice').value = '';
  document.getElementById('pfStock').value = '';
  document.getElementById('pfThumb').value = '';
  document.getElementById('pfDesc').value = '';
  document.getElementById('pfOverlay').classList.add('on');
  document.body.style.overflow = 'hidden';
  setTimeout(function(){ document.getElementById('pfName').focus({preventScroll:true}); }, 250);
}
function closeProdukForm(){
  document.getElementById('pfOverlay').classList.remove('on');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeProdukForm(); });

async function submitProduk(){
  if(!supabaseClient) return;
  var name = document.getElementById('pfName').value.trim();
  var priceRaw = document.getElementById('pfPrice').value;
  var stockRaw = document.getElementById('pfStock').value;
  var thumb = document.getElementById('pfThumb').value.trim();
  var desc = document.getElementById('pfDesc').value.trim();

  if(!name){ alert('Nama produk wajib diisi'); return; }
  var price = parseInt(priceRaw, 10);
  if(!priceRaw || isNaN(price) || price < 0){ alert('Harga produk gak valid'); return; }
  var stock = stockRaw === '' ? null : parseInt(stockRaw, 10);

  var btn = document.getElementById('pfSubmitBtn');
  btn.disabled = true; btn.textContent = 'Menyimpan…';

  try{
    var { data: userData } = await supabaseClient.auth.getUser();
    var user = userData ? userData.user : null;
    if(!user) throw new Error('Sesi login habis, silakan login ulang.');

    var { error } = await supabaseClient.from('reseller_products').insert({
      owner_id: user.id,
      owner_name: getFirstNameFromUser(user),
      name: name,
      price: price,
      stock: stock,
      thumbnail: thumb || null,
      description: desc || null
    });
    if(error) throw error;

    closeProdukForm();
    loadResellerProducts();
    loadTokoProducts();
  }catch(err){
    console.error('Gagal simpan produk:', err);
    alert(err.message || 'Gagal menyimpan produk');
  }finally{
    btn.disabled = false; btn.textContent = 'Simpan Produk';
  }
}

async function deleteProduk(id){
  if(!supabaseClient) return;
  if(!confirm('Hapus produk ini?')) return;
  try{
    var { error } = await supabaseClient.from('reseller_products').delete().eq('id', id);
    if(error) throw error;
    loadResellerProducts();
    loadTokoProducts();
  }catch(err){
    console.error('Gagal hapus produk:', err);
    alert('Gagal menghapus produk');
  }
}

function renderProdukList(items){
  var list = document.getElementById('taProdukList');
  var empty = document.getElementById('taProdukEmpty');
  if(!items || !items.length){
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = items.map(function(p){
    var thumbHtml = p.thumbnail
      ? '<img class="rp-thumb" src="'+esc(p.thumbnail)+'" alt="'+esc(p.name)+'" onerror="this.outerHTML=\'<div class=&quot;rp-thumb-placeholder&quot;>?</div>\'">'
      : '<div class="rp-thumb-placeholder">?</div>';
    var stockText = (p.stock === null || p.stock === undefined) ? 'Stok unlimited' : ('Stok ' + p.stock);
    return '<div class="rp-card">' +
      thumbHtml +
      '<div class="rp-info">' +
        '<div class="rp-name">'+esc(p.name)+'</div>' +
        '<div class="rp-price">'+idr(p.price)+'</div>' +
        '<div class="rp-stock">'+stockText+'</div>' +
      '</div>' +
      '<div class="rp-del" onclick="deleteProduk(\''+p.id+'\')">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function loadResellerProducts(){
  if(!supabaseClient) return;
  try{
    var { data: userData } = await supabaseClient.auth.getUser();
    var user = userData ? userData.user : null;
    if(!user){ renderProdukList([]); return; }

    var { data, error } = await supabaseClient
      .from('reseller_products')
      .select('*')
      .eq('owner_id', user.id)
      .order('created_at', { ascending: false });
    if(error) throw error;
    renderProdukList(data || []);
  }catch(err){
    console.error('Gagal memuat produk reseller:', err);
  }
}
loadResellerProducts();

/* ── Tab TOKO: produk dari SEMUA reseller (RLS cuma izinin yang active=true) ── */
function renderTokoGrid(items){
  var grid = document.getElementById('tokoGrid');
  var empty = document.getElementById('tokoEmpty');
  if(!items || !items.length){
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = items.map(function(p){
    var thumbHtml = p.thumbnail
      ? '<img src="'+esc(p.thumbnail)+'" alt="'+esc(p.name)+'" loading="lazy" onerror="this.style.display=\'none\'">'
      : '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
    var stockText = (p.stock === null || p.stock === undefined) ? '∞ Unlimited' : ('Stok ' + p.stock);
    return '<div class="tk-card" data-id="'+esc(p.id)+'">' +
      '<div class="tk-thumb">'+thumbHtml+'</div>' +
      '<div class="tk-body">' +
        '<div class="tk-name">'+esc(p.name)+'</div>' +
        '<div class="tk-price">'+idr(p.price)+'</div>' +
        '<div class="tk-stock">'+stockText+'</div>' +
      '</div>' +
    '</div>';
  }).join('');
}
document.getElementById('tokoGrid').addEventListener('click', function(e){
  var card = e.target.closest('.tk-card');
  if(!card) return;
  window.location.href = '/toko-produk-tokoresller/?id=' + encodeURIComponent(card.dataset.id);
});

async function loadTokoProducts(){
  if(!supabaseClient) return;
  try{
    var { data, error } = await supabaseClient
      .from('reseller_products')
      .select('*')
      .eq('active', true)
      .order('created_at', { ascending: false });
    if(error) throw error;
    renderTokoGrid(data || []);
  }catch(err){
    console.error('Gagal memuat produk toko:', err);
  }
}
loadTokoProducts();


/* ── Toggle antar view: Toko / Toko Anda ───────────────────── */
var viewToko = document.getElementById('viewToko');
var viewTokoAnda = document.getElementById('viewTokoAnda');

function switchView(navKey){
  if(navKey === 'toko-anda'){
    viewToko.style.display = 'none';
    viewTokoAnda.style.display = 'block';
    loadResellerProducts();
  } else {
    viewToko.style.display = 'block';
    viewTokoAnda.style.display = 'none';
    loadTokoProducts();
  }
}

/* ── Tab switching di dalam panel Toko Anda ───────────────── */
var taTabPanels = {
  produk: document.getElementById('taPanelProduk'),
  pesanan: document.getElementById('taPanelPesanan'),
  chat: document.getElementById('taPanelChat'),
  banner: document.getElementById('taPanelBanner'),
  pengaturan: document.getElementById('taPanelPengaturan')
};
var taTabs = document.getElementById('taTabs');
if(taTabs){
  taTabs.addEventListener('click', function(e){
    var btn = e.target.closest('.ta-tab');
    if(!btn) return;
    taTabs.querySelectorAll('.ta-tab').forEach(function(t){ t.classList.toggle('active', t === btn); });
    Object.keys(taTabPanels).forEach(function(key){
      if(taTabPanels[key]) taTabPanels[key].style.display = (key === btn.dataset.tab) ? 'block' : 'none';
    });
    if(btn.dataset.tab === 'chat') loadSellerChats();
  });
}

/* ── Daftar chat masuk (tab Chat di Toko Anda) ────────────── */
function timeAgoID(iso){
  var diffMs = Date.now() - new Date(iso).getTime();
  var min = Math.floor(diffMs / 60000);
  if(min < 1) return 'baru saja';
  if(min < 60) return min + 'm';
  var hr = Math.floor(min / 60);
  if(hr < 24) return hr + 'j';
  var d = Math.floor(hr / 24);
  return d + 'h';
}

function renderSellerChats(chats, myUserId){
  var list = document.getElementById('taChatList');
  var empty = document.getElementById('taChatEmpty');
  if(!chats || !chats.length){
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = chats.map(function(c){
    // Kalau saya yang jadi pembeli di chat ini, tampilkan nama penjualnya.
    // Kalau saya yang jadi penjual, tampilkan nama pembelinya.
    var iAmBuyer = c.buyer_id === myUserId;
    var name = iAmBuyer ? (c.seller_name || 'Penjual') : (c.buyer_name || 'Pembeli');
    var roleTag = iAmBuyer ? 'Ke: ' : 'Dari: ';
    return '<div class="chat-item" data-id="'+c.id+'" data-name="'+esc(name)+'" data-sub="'+esc(c.product_name||'')+'">' +
      '<div class="chat-avatar">'+esc(name.charAt(0).toUpperCase())+'</div>' +
      '<div class="chat-info">' +
        '<div class="chat-name">'+esc(roleTag)+esc(name)+'</div>' +
        '<div class="chat-last">'+(c.last_message ? esc(c.last_message) : 'Menunggu balasan…')+'</div>' +
      '</div>' +
      '<div class="chat-time">'+timeAgoID(c.last_message_at)+'</div>' +
    '</div>';
  }).join('');
}

async function loadSellerChats(){
  if(!supabaseClient) return;
  try{
    var { data: userData } = await supabaseClient.auth.getUser();
    var user = userData ? userData.user : null;
    if(!user) return;

    var { data, error } = await supabaseClient
      .from('chats')
      .select('*')
      .or('buyer_id.eq.' + user.id + ',seller_id.eq.' + user.id)
      .order('last_message_at', { ascending: false });
    if(error) throw error;
    renderSellerChats(data || [], user.id);
  }catch(err){
    console.error('Gagal memuat chat:', err);
  }
}

document.getElementById('taChatList').addEventListener('click', function(e){
  var item = e.target.closest('.chat-item');
  if(!item) return;
  openChatModal(item.dataset.id, item.dataset.name, item.dataset.sub ? ('Tentang: ' + item.dataset.sub) : '');
});

/* ── Tombol Tambah Produk / Tambah Banner (placeholder dulu) ── */
var taAddProdukBtn = document.getElementById('taAddProdukBtn');
if(taAddProdukBtn){
  taAddProdukBtn.addEventListener('click', function(){
    openProdukForm();
  });
}
var taAddBannerBtn = document.getElementById('taAddBannerBtn');
if(taAddBannerBtn){
  taAddBannerBtn.addEventListener('click', function(){
    alert('Form tambah banner akan segera hadir.');
  });
}

/* ── Tombol Keluar (logout beneran) ───────────────────────── */
var taLogoutBtn = document.getElementById('taLogoutBtn');
if(taLogoutBtn){
  taLogoutBtn.addEventListener('click', async function(){
    if(!supabaseClient) return;
    taLogoutBtn.disabled = true;
    taLogoutBtn.textContent = 'Keluar…';
    await supabaseClient.auth.signOut();
    window.location.href = '/login/';
  });
}
// bottom nav active state + moving purple indicator
var navIndicator = document.getElementById('navIndicator');
var navItems = document.querySelectorAll('.nav-item');

function moveIndicatorTo(item){
  var navRect = item.parentElement.getBoundingClientRect();
  var itemRect = item.getBoundingClientRect();
  var width = 28;
  var left = (itemRect.left - navRect.left) + (itemRect.width / 2) - (width / 2);
  navIndicator.style.width = width + 'px';
  navIndicator.style.left = left + 'px';
}

navItems.forEach(function(item){
  item.addEventListener('click', function(){
    navItems.forEach(function(i){ i.classList.remove('active'); });
    item.classList.add('active');
    moveIndicatorTo(item);
    switchView(item.dataset.nav);
  });
});

// set initial indicator position on load
window.addEventListener('load', function(){
  var activeItem = document.querySelector('.nav-item.active');
  if(activeItem){
    navIndicator.style.transition = 'none';
    moveIndicatorTo(activeItem);
    requestAnimationFrame(function(){
      navIndicator.style.transition = 'left .25s ease, width .25s ease';
    });
  }
});

// icon buttons feedback (wallet/help/lang)
document.querySelectorAll('.icon-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    btn.style.opacity = '0.6';
    setTimeout(function(){ btn.style.opacity = '1'; }, 150);
  });
});
</script>
</body>
