<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>orbitxy.com - Detail Game</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #121212;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  button, input, a { outline: none; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #161616;
    padding: 16px 20px;
  }
  .logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #ffb347 0%, #ff2d78 20%, #8b2fd6 38%, #2f7bff 55%, #14c4b0 75%, #4ade80 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .btn-bell {
    background: #2c2c2e;
    border: none;
    border-radius: 8px;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .btn-bell svg { width: 20px; height: 20px; color: #ffffff; }

  .subheader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
  }
  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: #f0f0f0;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .back-btn svg { width: 20px; height: 20px; }
  .sub-actions {
    display: flex;
    gap: 10px;
  }
  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: #232325;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cfcfcf;
    cursor: pointer;
  }
  .icon-btn svg { width: 18px; height: 18px; }

  .game-cover-wrap {
    display: flex;
    justify-content: center;
    padding: 20px 20px 10px;
  }
  .game-cover {
    width: 160px;
    height: 220px;
    border-radius: 14px;
    background: #1a1a1a;
    border: 1px solid #2a2a2c;
    overflow: hidden;
    position: relative;
  }
  .game-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .game-cover .badge {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,0.5);
    color: #ffffff;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.5px;
    padding: 4px 8px;
    border-radius: 6px;
  }

  .game-title {
    text-align: center;
    color: #ffffff;
    font-size: 26px;
    font-weight: 800;
    margin: 18px 0 10px;
  }
  .game-provider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
  }
  .game-provider .prov-badge {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: linear-gradient(135deg, #ffb347, #ff2d78, #8b2fd6, #2f7bff);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 10px;
    font-weight: 800;
  }
  .game-provider span.name {
    color: #cfcfcf;
    font-size: 15px;
  }

  .game-options {
    background: #1c1c1e;
    border: 1px solid #2a2a2c;
    border-radius: 16px;
    margin: 0 20px 20px;
    overflow: hidden;
  }
  .option-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
  }
  .option-row + .option-row {
    border-top: 1px solid #2a2a2c;
  }
  .option-row .label {
    color: #f0f0f0;
    font-size: 15px;
    font-weight: 600;
  }
  .toggle {
    width: 46px;
    height: 26px;
    border-radius: 20px;
    background: #3a3a3c;
    position: relative;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .toggle .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #ffffff;
    transition: transform 0.2s ease;
  }
  .toggle.on {
    background: #1a73e8;
  }
  .toggle.on .knob {
    transform: translateX(20px);
  }

  .action-row {
    display: flex;
    gap: 12px;
    padding: 0 20px 30px;
  }
  .btn-main {
    flex: 1;
    background: #1a73e8;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-demo {
    flex: 1;
    background: #2c2c2e;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">orbitxy</div>
    <button class="btn-bell">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a6 6 0 0 0-6 6v3.2c0 .6-.2 1.2-.6 1.7L4 15.5c-.6.8 0 2 1 2h14c1 0 1.6-1.2 1-2l-1.4-2.6c-.4-.5-.6-1.1-.6-1.7V8a6 6 0 0 0-6-6z"/><path d="M9.5 20a2.5 2.5 0 0 0 5 0" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
  </div>

  <div class="subheader">
    <button class="back-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
      Kembali
    </button>
    <div class="sub-actions">
      <button class="icon-btn" title="Bagikan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
      </button>
      <button class="icon-btn" title="Simpan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4V3z"/></svg>
      </button>
    </div>
  </div>

  <div class="game-cover-wrap">
    <div class="game-cover" id="gameCover">
      <span class="badge">OBX GAMES</span>
    </div>
  </div>

  <div class="game-title" id="gameTitle">Nama Game</div>
  <div class="game-provider">
    <div class="prov-badge">OB</div>
    <span class="name">OBX Games</span>
  </div>

  <div class="game-options">
    <div class="option-row">
      <span class="label">Mode layar penuh</span>
      <button class="toggle" id="fullscreenToggle">
        <span class="knob"></span>
      </button>
    </div>
  </div>

  <div class="action-row">
    <button class="btn-main">Main</button>
    <button class="btn-demo">Mode demo</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const toggle = document.getElementById('fullscreenToggle');
    toggle.addEventListener('click', function() {
      toggle.classList.toggle('on');
    });

    // ---- Ambil data game dari Supabase (tabel "games") berdasarkan ?id= ----
    const SUPABASE_URL = "https://xvvnnqpjiyervgnyffqs.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Qp9izsQ77Ym9vzSBxwd--A_AZxfy4vs";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadGame() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) return;

      const { data: game, error } = await sb
        .from('games')
        .select('title, image_url, provider')
        .eq('id', id)
        .single();

      if (error || !game) {
        document.getElementById('gameTitle').textContent = 'Game tidak ditemukan';
        return;
      }

      document.getElementById('gameTitle').textContent = game.title;
      if (game.provider) {
        document.querySelector('.game-provider .name').textContent = game.provider;
      }
      if (game.image_url) {
        const cover = document.getElementById('gameCover');
        const imgEl = document.createElement('img');
        imgEl.src = game.image_url;
        cover.appendChild(imgEl);
      }
    }
    loadGame();
  </script>
</body>
</html>
