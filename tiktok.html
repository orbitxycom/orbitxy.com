<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#181818">
<title>TikTok Downloader — orbitxy.com</title>
<link rel="icon" type="image/png" href="https://orbitxy.com/orbitxy.com.png">
<link rel="apple-touch-icon" href="https://orbitxy.com/orbitxy.com.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#181818;--bg1:#1a1a1a;--bg2:#212121;--bg3:#2a2a2a;
    --line:#2E2E2E;--line2:#3a3a3a;--line3:#484848;
    --em:#34d399;--em2:#6ee7b7;--em-rgb:52,211,153;
    --t1:#e5e5e5;--t2:#a0a0a0;--t3:#616161;--t4:rgba(255,255,255,.07);
    --font:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --rad:4px;--rs:4px;--trans:.18s cubic-bezier(.4,0,.2,1);
  }
  html,body{min-height:100vh;background:var(--bg);color:#fff;font-family:var(--font)}
  body{
    background-color:var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:40px 40px;
  }

  /* ── Shared Navbar (identik dengan ulasan.html) ──────────── */
  .snav{
    position:sticky;top:0;z-index:200;
    background:rgba(24,24,24,.96);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--line);
    height:46px;display:flex;align-items:center;
    padding:0 1.2rem;gap:.6rem;
  }
  .snav-logo{
    display:flex;align-items:center;gap:9px;
    font-size:.9rem;font-weight:700;letter-spacing:-.02em;color:var(--t1);
    text-decoration:none;flex-shrink:0;
  }
  .snav-name{color:var(--t1)}
  .snav-r{display:flex;align-items:center;gap:.4rem;margin-left:auto}
  .snav-btn{
    font-family:var(--font);font-size:.7rem;font-weight:600;
    padding:.28rem .75rem;border-radius:4px;
    border:1px solid var(--line2);background:var(--bg2);
    color:var(--t2);cursor:pointer;transition:all .18s;text-decoration:none;
    display:inline-flex;align-items:center;gap:.3rem;height:32px;min-height:unset;
  }
  .snav-btn:hover{border-color:var(--line3);color:var(--t1)}
  .snav-btn.em{border-color:#047857;color:#fff;background:#047857}
  .snav-btn.em:hover{background:#059669;border-color:#059669}
  @media(max-width:680px){
    .snav-btn.hide-m{display:none}
  }

  /* ── Konten halaman TikTok Downloader ─────────────────────── */
  .content { padding: 20px 20px 60px; max-width: 480px; margin: 0 auto; }
  .page-title { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 6px; color:#fff; }
  .page-sub { color: #8a8a8a; font-size: 14px; margin-bottom: 28px; }

  .input-box {
    display: flex; gap: 10px; background: var(--bg1); border: 1px solid var(--line2);
    border-radius: 16px; padding: 6px 6px 6px 18px; align-items: center;
  }
  .input-box input {
    flex: 1; background: none; border: none; outline: none; color: #fff;
    font-size: 15px; padding: 12px 0;
  }
  .input-box input::placeholder { color: #6a6a6a; }
  .btn-go {
    background: #fff; color: #0a0a0a; border: none; border-radius: 12px;
    padding: 12px 20px; font-size: 14px; font-weight: 800; cursor: pointer;
    white-space: nowrap; transition: opacity .15s ease;
  }
  .btn-go:hover { opacity: .85; }
  .btn-go:disabled { opacity: .4; cursor: not-allowed; }

  .result { margin-top: 24px; }
  .result-card {
    background: var(--bg1); border: 1px solid var(--line2); border-radius: 20px;
    padding: 18px; display: none;
  }
  .result-card.show { display: block; }
  .result-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; line-height: 1.4; color:#fff }
  .result-author { font-size: 13px; color: #8a8a8a; margin-bottom: 16px; }
  .result-video {
    width: 100%; border-radius: 14px; background: #000; display: block; max-height: 480px;
  }
  .result-images {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .result-images img {
    width: 100%; border-radius: 12px; display: block; object-fit: cover; aspect-ratio: 3/4;
  }
  .dl-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .dl-btn {
    flex: 1; text-align: center; text-decoration: none;
    background: var(--em); color: #04110a; font-weight: 800; font-size: 14px;
    padding: 13px; border-radius: 12px; transition: opacity .15s ease;
    border: none; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-width: 140px;
  }
  .dl-btn.secondary { background: var(--bg2); color: #fff; border: 1px solid var(--line2); }
  .dl-btn:hover { opacity: .88; }
  .dl-btn:disabled { opacity: .5; cursor: not-allowed; }
  .dl-btn .mini-spin {
    width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3);
    border-top-color: currentColor; border-radius: 50%;
    animation: spin .7s linear infinite; display: inline-block;
  }

  .state-msg {
    text-align: center; padding: 28px 10px; color: #8a8a8a; font-size: 14px;
    display: none;
  }
  .state-msg.show { display: block; }
  .spin {
    width: 26px; height: 26px; border: 3px solid var(--line2); border-top-color: var(--em);
    border-radius: 50%; margin: 0 auto 12px; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .notif {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--bg1); border: 1px solid var(--line2); border-radius: 12px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; color: #fff;
    z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    max-width: 90vw; text-align: center;
  }
  .notif.show { opacity: 1; }

  ::selection{background:rgba(74,222,128,.18);color:#e5e5e5}
</style>
</head>
<body>

<div id="notif" class="notif"></div>

<nav class="snav">
  <a href="dashboard.html" class="snav-logo" id="snavLogo">
    <span aria-hidden="true" oncontextmenu="return false" draggable="false" style="display:inline-block;width:26px;height:26px;border-radius:6px;flex-shrink:0;background-image:url('https://orbitxy.com/orbitxy.com.png');background-size:cover;background-position:center;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;pointer-events:none"></span>
    <span class="snav-name" id="snavName">orbitxy.com</span>
  </a>
  <div class="snav-r">
    <a href="dashboard.html" class="snav-btn hide-m">Beranda</a>
    <a href="#" class="snav-btn hide-m" onclick="return notReady(event)">Track Order</a>
    <a href="#" class="snav-btn hide-m" onclick="return notReady(event)">cPanel</a>
    <a href="#" id="snavWaBtn" class="snav-btn em hide-m" onclick="return notReady(event)">Hubungi CS</a>
    <a href="dashboard.html" class="snav-btn" id="snavHbg" style="display:flex">Kembali</a>
  </div>
</nav>
<script>
(function(){
  fetch('/api/products').then(function(r){return r.json();}).then(function(j){
    if(!j)return;
    var name=j.store||(j.settings&&j.settings.storeName)||'';
    if(name){
      var el=document.getElementById('snavName');if(el)el.textContent=name;
      document.querySelectorAll('.js-store-name,[data-store-name]').forEach(function(el){el.textContent=name;});
    }
    var wa=j.wa||(j.settings&&j.settings.wa)||'';
    if(wa){
      var wb=document.getElementById('snavWaBtn');if(wb)wb.href=wa;
      var wl=document.getElementById('snavWaLink');if(wl)wl.href=wa;
    }
    var ch=j.channel||(j.settings&&(j.settings.channelWa||j.settings.channel))||'';
    if(ch)document.querySelectorAll('[data-channel-link]').forEach(function(el){el.href=ch;el.style.display=''});
    var pc=(j.settings&&j.settings.primaryColor)||'';
    if(pc){
      function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16);}
      document.documentElement.style.setProperty('--em',pc);
      document.documentElement.style.setProperty('--em2',pc);
      document.documentElement.style.setProperty('--em-rgb',hexRgb(pc));
      document.documentElement.setAttribute('data-em',pc);
      var _tmeta=document.querySelector('meta[name="theme-color"]');if(_tmeta)_tmeta.setAttribute('content',pc);
    }
  }).catch(function(){});
})();
</script>

<div class="content">
  <div class="page-title">TikTok Downloader</div>
  <div class="page-sub">Tempel link video atau foto TikTok di bawah, lalu unduh tanpa watermark.</div>

  <div class="input-box">
    <input type="text" id="linkInput" placeholder="https://www.tiktok.com/@user/video/..." autocomplete="off">
    <button class="btn-go" id="goBtn">Ambil</button>
  </div>

  <div class="result">
    <div class="state-msg" id="loadingMsg">
      <div class="spin"></div>
      Memproses link...
    </div>
    <div class="state-msg" id="errorMsg"></div>

    <div class="result-card" id="resultCard">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-author" id="resultAuthor"></div>
      <video class="result-video" id="resultVideo" controls playsinline style="display:none"></video>
      <div class="result-images" id="resultImages" style="display:none"></div>
      <div class="dl-row" id="dlRow"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  var supabaseClient;
  try {
    supabaseClient = supabase.createClient(
      'https://ygjpwaftccewntwwoixs.supabase.co',
      'sb_publishable_4IdyoPpEW-It9IWLZOrSAQ_WuumXkl9'
    );
  } catch(e) { console.error('Gagal memuat Supabase:', e); }

  function notify(msg){
    var n = document.getElementById('notif');
    n.textContent = msg;
    n.classList.add('show');
    setTimeout(function(){ n.classList.remove('show'); }, 2500);
  }

  function notReady(e){
    if(e && e.preventDefault) e.preventDefault();
    notify('Sedang diperbaiki');
    return false;
  }
  window.notReady = notReady;

  // ── Force-download helper ──────────────────────────────
  // Fetch file sebagai blob lalu trigger <a download> dengan blob URL
  // (blob URL = same-origin, jadi atribut download pasti dihormati browser).
  // Kalau fetch gagal (biasanya karena CORS diblokir server sumbernya),
  // fallback ke cara lama: buka di tab baru.
  async function forceDownload(url, filename, btnEl){
    const originalHTML = btnEl ? btnEl.innerHTML : '';
    if(btnEl){
      btnEl.disabled = true;
      btnEl.innerHTML = '<span class="mini-spin"></span> Mengunduh...';
    }
    try {
      const res = await fetch(url, { mode: 'cors' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const blobUrl = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 8000);
      notify('File sedang diunduh...');
    } catch(err){
      console.warn('Force-download gagal, fallback ke tab baru:', err);
      notify('Tidak bisa unduh langsung, membuka file di tab baru');
      window.open(url, '_blank', 'noopener');
    } finally {
      if(btnEl){
        btnEl.disabled = false;
        btnEl.innerHTML = originalHTML;
      }
    }
  }

  // ── TikTok Downloader ──────────────────────────────────
  const linkInput = document.getElementById('linkInput');
  const goBtn = document.getElementById('goBtn');
  const loadingMsg = document.getElementById('loadingMsg');
  const errorMsg = document.getElementById('errorMsg');
  const resultCard = document.getElementById('resultCard');
  const resultTitle = document.getElementById('resultTitle');
  const resultAuthor = document.getElementById('resultAuthor');
  const resultVideo = document.getElementById('resultVideo');
  const resultImages = document.getElementById('resultImages');
  const dlRow = document.getElementById('dlRow');

  function resetResult(){
    loadingMsg.classList.remove('show');
    errorMsg.classList.remove('show');
    resultCard.classList.remove('show');
    resultVideo.style.display = 'none';
    resultVideo.pause();
    resultVideo.removeAttribute('src');
    resultImages.style.display = 'none';
    resultImages.innerHTML = '';
    dlRow.innerHTML = '';
  }

  async function fetchTikTok(){
    const url = linkInput.value.trim();
    if(!url){ notify('Tempel link TikTok dulu'); return; }
    if(!url.includes('tiktok.com')){ notify('Link kelihatannya bukan link TikTok'); return; }

    resetResult();
    loadingMsg.classList.add('show');
    goBtn.disabled = true;

    try {
      const api = 'https://www.tikwm.com/api/?url=' + encodeURIComponent(url) + '&hd=1';
      const res = await fetch(api);
      const json = await res.json();

      loadingMsg.classList.remove('show');

      if(json.code !== 0 || !json.data){
        errorMsg.textContent = 'Gagal mengambil data. Pastikan link-nya benar dan videonya publik.';
        errorMsg.classList.add('show');
        return;
      }

      const d = json.data;
      resultTitle.textContent = d.title || 'Tanpa judul';
      resultAuthor.textContent = d.author ? ('@' + (d.author.unique_id || d.author.nickname || '')) : '';

      if(Array.isArray(d.images) && d.images.length){
        resultImages.style.display = 'grid';
        resultImages.innerHTML = d.images.map(function(src){
          return '<img src="' + src + '" alt="Foto TikTok" loading="lazy">';
        }).join('');
        d.images.forEach(function(src, i){
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'dl-btn' + (i === 0 ? '' : ' secondary');
          btn.textContent = 'Foto ' + (i + 1);
          btn.addEventListener('click', function(){
            forceDownload(src, 'tiktok-foto-' + (i + 1) + '.jpg', btn);
          });
          dlRow.appendChild(btn);
        });
      } else if(d.play || d.hdplay){
        const videoUrl = d.hdplay || d.play;
        resultVideo.src = videoUrl;
        resultVideo.style.display = 'block';

        const btn1 = document.createElement('button');
        btn1.type = 'button';
        btn1.className = 'dl-btn';
        btn1.textContent = 'Unduh Video (Tanpa Watermark)';
        btn1.addEventListener('click', function(){
          forceDownload(videoUrl, 'tiktok-video.mp4', btn1);
        });
        dlRow.appendChild(btn1);

        if(d.music){
          const btn2 = document.createElement('button');
          btn2.type = 'button';
          btn2.className = 'dl-btn secondary';
          btn2.textContent = 'Unduh Audio';
          btn2.addEventListener('click', function(){
            forceDownload(d.music, 'tiktok-audio.mp3', btn2);
          });
          dlRow.appendChild(btn2);
        }
      } else {
        errorMsg.textContent = 'Konten tidak ditemukan pada link ini.';
        errorMsg.classList.add('show');
        return;
      }

      resultCard.classList.add('show');
    } catch(err){
      loadingMsg.classList.remove('show');
      errorMsg.textContent = 'Gagal terhubung ke layanan unduhan. Coba lagi.';
      errorMsg.classList.add('show');
      console.error(err);
    } finally {
      goBtn.disabled = false;
    }
  }

  goBtn.addEventListener('click', fetchTikTok);
  linkInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') fetchTikTok();
  });
</script>
</body>
</html>
