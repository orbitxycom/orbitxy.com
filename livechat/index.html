<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Chat</title>
<link rel="icon" type="image/png" href="https://orbitxy.com/orbitxy.comV1.png">
<link rel="apple-touch-icon" href="https://orbitxy.com/orbitxy.comV1.png">
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    font-family: system-ui, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    border-bottom: 1px solid #1a1a1a;
    background: #000;
    flex-shrink: 0;
  }
  .back-btn {
    width: 38px; height: 38px; border-radius: 12px;
    background: #111; border: 1px solid #2a2a2a;
    display: flex; align-items: center; justify-content: center;
    color: #fff; text-decoration: none; flex-shrink: 0;
    transition: background .15s ease;
  }
  .back-btn:hover { background: #171717; }
  .back-btn svg { width: 18px; height: 18px; }
  .topbar-title { font-size: 1rem; font-weight: 800; color: #fff; }
  .topbar-sub { font-size: .7rem; color: #8a8a8a; display: flex; align-items: center; gap: 5px; }
  .topbar-sub .dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 75%;
    display: flex;
    flex-direction: column;
  }
  .sender-name {
    font-size: .68rem;
    font-weight: 700;
    color: #9a9a9a;
    margin: 0 4px 3px;
  }
  .bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 0.95rem;
    line-height: 1.4;
    color: #ffffff !important;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .bubble img.chat-photo {
    max-width: 100%;
    border-radius: 12px;
    display: block;
    margin-bottom: 6px;
    cursor: zoom-in;
  }
  .msg.them .bubble {
    background: #1a1a1a;
    border-bottom-left-radius: 2px;
  }
  .msg.me .bubble {
    background: #2a2a2a;
    border: 2px solid transparent;
    background-image: linear-gradient(#2a2a2a, #2a2a2a), linear-gradient(90deg, #4F5BD5, #2FBF71, #7EFA7E, #D6E976, #FEDA75);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    border-bottom-right-radius: 2px;
  }
  .msg.them {
    align-self: flex-start;
  }
  .msg.me {
    align-self: flex-end;
  }
  .time {
    margin-top: 4px;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0 4px;
    background: linear-gradient(90deg, #FEDA75, #FA7E1E, #D62976, #962FBF, #4F5BD5);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    display: inline-block;
  }
  .msg.me .time {
    text-align: right;
  }

  .empty-chat {
    margin: auto;
    text-align: center;
    color: #6a6a6a;
    font-size: .85rem;
    padding: 20px;
  }
  .loading-chat {
    margin: auto;
    text-align: center;
    color: #6a6a6a;
    font-size: .85rem;
  }
  .spin-sm {
    width: 22px; height: 22px; border: 3px solid #222; border-top-color: #22c55e;
    border-radius: 50%; margin: 0 auto 10px; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .input-row {
    position: relative;
    display: flex;
    gap: 8px;
    padding: 6px 12px 12px 12px;
    background: #000;
    border-top: none;
    margin-top: -1px;
    flex-shrink: 0;
  }
  .input-row input {
    flex: 1;
    min-width: 0;
    background-color: #111;
    color: #fff;
    padding: 12px 16px;
    border-radius: 24px;
    font-size: 1rem;
    outline: none;
    border: 2px solid transparent;
    background-image: linear-gradient(#111, #111), linear-gradient(90deg, #4F5BD5, #2FBF71, #7EFA7E, #D6E976, #FEDA75);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    caret-color: #D62976;
  }
  .input-row input:disabled { opacity: .5; }
  .input-row button {
    background: #fff;
    color: #000;
    border: none;
    width: 48px;
    height: 48px;
    min-width: 48px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 10px rgba(255, 255, 255, 0.15);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .input-row button:disabled { opacity: .4; cursor: not-allowed; }

  .input-row button svg {
    width: 20px;
    height: 20px;
  }

  .input-row button:hover {
    transform: scale(1.08);
    box-shadow: 0 4px 14px rgba(255, 255, 255, 0.25);
    filter: brightness(0.95);
  }

  .toggle-more {
    display: block;
    margin-top: 6px;
    color: #9a9a9a;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    width: fit-content;
  }
  .toggle-more:hover {
    color: #fff;
    text-decoration: underline;
  }
  .input-row button:active {
    transform: scale(0.92);
  }

  .input-row button.plus {
    background: #1a1a1a;
    color: #fff;
    box-shadow: none;
    flex-shrink: 0;
  }
  .input-row button.plus:hover {
    filter: brightness(1.2);
    box-shadow: none;
  }

  .plus-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 12px;
    background: #1e1e1e;
    border-radius: 16px;
    padding: 6px;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 10;
  }
  .plus-menu.open {
    display: block;
  }
  .plus-menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    cursor: pointer;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    white-space: nowrap;
    position: relative;
  }
  .plus-menu-item:hover {
    background: #2a2a2a;
  }
  .plus-menu-item .icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .plus-menu-item .icon svg {
    width: 18px;
    height: 18px;
  }
  .plus-menu-item input[type=file] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.95);
    z-index: 500; display: none; align-items: center; justify-content: center;
    padding: 1rem;
  }
  .lightbox.on { display: flex; }
  .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; object-fit: contain; }
  .lb-close {
    position: fixed; top: 1.2rem; right: 1.2rem; width: 36px; height: 36px;
    border-radius: 50%; background: rgba(255,255,255,.1); border: none; color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; z-index: 501;
  }

  .notif {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    max-width: 90vw;
    text-align: center;
  }
  .notif.show { opacity: 1; }
</style>
</head>
<body>

  <div id="notif" class="notif"></div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lb-close" onclick="closeLightbox()">✕</button>
    <img id="lbImg" src="" alt="">
  </div>

  <div class="topbar">
    <a href="/dashboard/" class="back-btn" aria-label="Kembali">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </a>
    <div>
      <div class="topbar-title">Live Chat</div>
      <div class="topbar-sub"><span class="dot"></span>Ruang obrolan semua pengguna</div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="loading-chat" id="loadingChat"><div class="spin-sm"></div>Memuat pesan...</div>
  </div>

  <div class="input-row">
    <button class="plus" aria-label="Tambah" id="plusBtn">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 5V19M5 12H19" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="plus-menu" id="plusMenu">
      <div class="plus-menu-item">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="#fff" stroke-width="1.8"/>
            <circle cx="8.5" cy="10.5" r="1.5" fill="#fff"/>
            <path d="M3 16L8 12L12 15L16 11L21 16" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        Foto
        <input type="file" id="photoFile" accept="image/jpeg,image/png,image/webp,image/gif">
      </div>
    </div>
    <input type="text" id="input" placeholder="Tulis pesan..." autocomplete="off" disabled>
    <button id="send" aria-label="Kirim" disabled>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 11.5L21 3L13.5 21L11 13L3 11.5Z" fill="#000"/>
      </svg>
    </button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseClient = supabase.createClient(
    'https://ygjpwaftccewntwwoixs.supabase.co',
    'sb_publishable_4IdyoPpEW-It9IWLZOrSAQ_WuumXkl9'
  );

  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const plusBtn = document.getElementById('plusBtn');
  const plusMenu = document.getElementById('plusMenu');
  const photoFile = document.getElementById('photoFile');
  const loadingChat = document.getElementById('loadingChat');

  let _me = null;          // { id, name }
  let _sending = false;

  // Bikin nama generik yang konsisten untuk user yang sama (privasi —
  // tidak pernah menampilkan email), berbentuk "PenggunaXXXX".
  function genericNameFor(userId) {
    let hash = 0;
    for (let i = 0; i < userId.length; i++) {
      hash = (hash * 31 + userId.charCodeAt(i)) >>> 0;
    }
    const num = 1000 + (hash % 9000); // angka 4 digit: 1000-9999
    return 'Pengguna' + num;
  }

  function notify(msg){
    var n = document.getElementById('notif');
    n.textContent = msg;
    n.classList.add('show');
    setTimeout(function(){ n.classList.remove('show'); }, 2500);
  }
  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;'); }

  plusBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    plusMenu.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!plusMenu.contains(e.target) && e.target !== plusBtn) {
      plusMenu.classList.remove('open');
    }
  });

  function timeFromISO(iso) {
    const d = iso ? new Date(iso) : new Date();
    const h = d.getHours().toString().padStart(2, '0');
    const m = d.getMinutes().toString().padStart(2, '0');
    return h + ':' + m;
  }

  const MAX_CHARS = 220;

  function openLightbox(url){
    document.getElementById('lbImg').src = url;
    document.getElementById('lightbox').classList.add('on');
  }
  function closeLightbox(){
    document.getElementById('lightbox').classList.remove('on');
  }
  window.openLightbox = openLightbox;
  window.closeLightbox = closeLightbox;

  function addMessage(row) {
    // row: { user_id, display_name, text, photo_url, created_at }
    if (loadingChat) loadingChat.remove();
    const emptyEl = document.getElementById('emptyChat');
    if (emptyEl) emptyEl.remove();

    const who = (_me && row.user_id === _me.id) ? 'me' : 'them';

    const div = document.createElement('div');
    div.className = 'msg ' + who;

    if (who === 'them') {
      const nameEl = document.createElement('div');
      nameEl.className = 'sender-name';
      nameEl.textContent = row.display_name || 'Pengguna';
      div.appendChild(nameEl);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (row.photo_url) {
      const img = document.createElement('img');
      img.className = 'chat-photo';
      img.src = row.photo_url;
      img.alt = 'Foto';
      img.loading = 'lazy';
      img.addEventListener('click', function(){ openLightbox(row.photo_url); });
      bubble.appendChild(img);
    }

    const text = row.text || '';
    if (text) {
      if (text.length > MAX_CHARS) {
        const shortText = text.slice(0, MAX_CHARS);
        const textNode = document.createElement('span');
        textNode.textContent = shortText;
        bubble.appendChild(textNode);

        const toggle = document.createElement('span');
        toggle.className = 'toggle-more';
        toggle.textContent = 'Tampilkan lebih banyak';
        bubble.appendChild(toggle);

        let expanded = false;
        toggle.addEventListener('click', () => {
          expanded = !expanded;
          textNode.textContent = expanded ? text : shortText;
          toggle.textContent = expanded ? 'Tampilkan lebih sedikit' : 'Tampilkan lebih banyak';
          messagesEl.scrollTop = messagesEl.scrollHeight;
        });
      } else {
        const textNode = document.createElement('span');
        textNode.textContent = text;
        bubble.appendChild(textNode);
      }
    }

    const timeSpan = document.createElement('span');
    timeSpan.className = 'time';
    timeSpan.textContent = timeFromISO(row.created_at);

    div.appendChild(bubble);
    div.appendChild(timeSpan);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function loadHistory() {
    const { data, error } = await supabaseClient
      .from('chat_messages')
      .select('*')
      .order('created_at', { ascending: true })
      .limit(100);

    if (loadingChat) loadingChat.remove();

    if (error) {
      messagesEl.innerHTML = '<div class="empty-chat" id="emptyChat">Gagal memuat pesan. Coba muat ulang halaman.<br><span style="color:#555;font-size:.7rem">' + esc(error.message) + '</span></div>';
      return;
    }
    if (!data || data.length === 0) {
      messagesEl.innerHTML = '<div class="empty-chat" id="emptyChat">Belum ada pesan.<br>Jadilah yang pertama menyapa! 👋</div>';
      return;
    }
    data.forEach(addMessage);
  }

  function subscribeRealtime() {
    supabaseClient
      .channel('public:chat_messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, (payload) => {
        addMessage(payload.new);
      })
      .subscribe();
  }

  async function handleSend() {
    if (_sending) return;
    const text = input.value.trim();
    if (!text) return;
    if (!_me) { notify('Sesi login habis, silakan login ulang.'); return; }

    _sending = true;
    send.disabled = true;

    const { error } = await supabaseClient.from('chat_messages').insert({
      user_id: _me.id,
      display_name: _me.name,
      text: text
    });

    _sending = false;
    send.disabled = false;

    if (error) {
      notify('Gagal mengirim: ' + error.message);
      return;
    }
    input.value = '';
  }

  async function handlePhotoSend(file) {
    if (!_me) { notify('Sesi login habis, silakan login ulang.'); return; }
    if (file.size > 10 * 1024 * 1024) { notify('Foto maksimal 10MB'); return; }

    notify('Mengirim foto...');
    try {
      const ext = file.name.split('.').pop();
      const path = _me.id + '/' + Date.now() + '.' + ext;
      const { error: upErr } = await supabaseClient.storage
        .from('orbitxy.com_chat')
        .upload(path, file);
      if (upErr) { notify('Gagal upload foto: ' + upErr.message); return; }

      const { data: pub } = supabaseClient.storage.from('orbitxy.com_chat').getPublicUrl(path);

      const { error: insErr } = await supabaseClient.from('chat_messages').insert({
        user_id: _me.id,
        display_name: _me.name,
        photo_url: pub.publicUrl
      });
      if (insErr) { notify('Gagal mengirim foto: ' + insErr.message); return; }
    } catch (e) {
      notify('Error: ' + e.message);
    }
  }

  send.addEventListener('click', handleSend);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });
  photoFile.addEventListener('change', function(){
    const file = photoFile.files[0];
    photoFile.value = '';
    plusMenu.classList.remove('open');
    if (file) handlePhotoSend(file);
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  (async function init(){
    const { data } = await supabaseClient.auth.getUser();
    const user = data ? data.user : null;
    if (!user) {
      window.location.href = '/login/?returnUrl=' + encodeURIComponent('/livechat/');
      return;
    }
    _me = { id: user.id, name: genericNameFor(user.id) };
    input.disabled = false;
    send.disabled = false;

    await loadHistory();
    subscribeRealtime();
  })();
</script>

</body>
</html>
