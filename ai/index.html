<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bekki AI × OrbitXY</title>
  <meta name="description" content="Bekki AI × OrbitXY — asisten percakapan AI yang cepat dan rapi.">
  <meta name="theme-color" content="#0C0E1B">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></symbol>
      <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3Z"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <div class="scrim" id="scrim"></div>

    <aside class="sidebar" id="sidebar" aria-label="Riwayat percakapan">
      <div class="brand">
        <img src="assets/logo.png" alt="" width="32" height="32">
        <div class="brand-text"><strong>Bekki AI</strong><span>× OrbitXY</span></div>
      </div>
      <button type="button" class="btn-new" id="newChat">
        <svg class="i"><use href="#i-plus"/></svg><span>Chat baru</span>
      </button>
      <nav class="history" id="history" aria-label="Riwayat"></nav>
      <div class="side-foot" id="status"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button type="button" class="icon-btn" id="toggleSidebar" aria-label="Buka atau tutup sidebar" aria-expanded="true">
          <svg class="i"><use href="#i-menu"/></svg>
        </button>
        <h1 class="title" id="title">Percakapan baru</h1>
        <button type="button" class="icon-btn" id="toggleTheme" aria-label="Ganti mode gelap atau terang">
          <svg class="i i-sun"><use href="#i-sun"/></svg>
          <svg class="i i-moon"><use href="#i-moon"/></svg>
        </button>
      </header>

      <section class="stage" id="stage">
        <div class="empty" id="empty">
          <div class="orbit" aria-hidden="true">
            <span class="ring r1"></span><span class="ring r2"></span>
            <img src="assets/logo.png" alt="" width="64" height="64">
          </div>
          <h2>Apa yang ingin kamu kerjakan hari ini?</h2>
          <p>Bekki AI × OrbitXY membantu menulis, belajar, dan membangun. Ketik pertanyaan, atau mulai dari salah satu ide di bawah.</p>
          <div class="suggest">
            <button type="button" data-prompt="Jelaskan apa itu API dengan bahasa sederhana"><svg class="i"><use href="#i-bulb"/></svg>Jelaskan apa itu API dengan bahasa sederhana</button>
            <button type="button" data-prompt="Bantu saya menulis email profesional untuk menunda rapat"><svg class="i"><use href="#i-pen"/></svg>Bantu menulis email profesional untuk menunda rapat</button>
            <button type="button" data-prompt="Buatkan contoh fungsi debounce di JavaScript beserta penjelasannya"><svg class="i"><use href="#i-code"/></svg>Contoh fungsi debounce di JavaScript</button>
            <button type="button" data-prompt="Berikan 10 ide nama untuk startup teknologi"><svg class="i"><use href="#i-compass"/></svg>10 ide nama untuk startup teknologi</button>
          </div>
        </div>
        <div class="thread" id="thread" role="log" aria-live="polite" hidden></div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" maxlength="8000" placeholder="Tanyakan apa saja ke Bekki…" aria-label="Pesan"></textarea>
          <button type="submit" class="send" id="send" aria-label="Kirim" disabled>
            <svg class="i"><use id="sendIcon" href="#i-up"/></svg>
          </button>
        </form>
        <p class="note">Bekki AI bisa keliru. Periksa kembali informasi penting.</p>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
</body>
</html>
