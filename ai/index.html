<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>bekki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href:root {
  --radius: 0.625rem;
  --background: oklch(0.985 0 0);
  --foreground: oklch(0.12 0 0);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.12 0 0);
  --popover: oklch(1 0 0);
  --popover-foreground: oklch(0.12 0 0);
  --primary: oklch(0.12 0 0);
  --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.965 0 0);
  --secondary-foreground: oklch(0.38 0 0);
  --muted: oklch(0.94 0 0);
  --muted-foreground: oklch(0.58 0 0);
  --accent: oklch(0.965 0 0);
  --accent-foreground: oklch(0.12 0 0);
  --destructive: oklch(0.55 0.15 25);
  --border: oklch(0.9 0 0);
  --input: oklch(0.9 0 0);
  --ring: oklch(0.5 0 0);
  --sidebar: oklch(0.97 0 0);
  --sidebar-foreground: oklch(0.38 0 0);
  --sidebar-primary: oklch(0.12 0 0);
  --sidebar-primary-foreground: oklch(0.985 0 0);
  --sidebar-accent: oklch(0.12 0 0 / 0.06);
  --sidebar-accent-foreground: oklch(0.12 0 0);
  --sidebar-border: oklch(0.88 0 0);
  --sidebar-ring: oklch(0.5 0 0);

  --shadow-card: 0 1px 3px oklch(0 0 0 / 0.05), 0 1px 1px oklch(0 0 0 / 0.03);
  --shadow-float:
    0 8px 24px -6px oklch(0 0 0 / 0.1), 0 2px 8px -2px oklch(0 0 0 / 0.04);
  --shadow-composer: 0 1px 2px oklch(0 0 0 / 0.04);
  --shadow-composer-focus:
    0 0 0 1px oklch(0 0 0 / 0.06), 0 2px 8px -2px oklch(0 0 0 / 0.06);
  --shadow-inset: inset 0 1px 1px oklch(0 0 0 / 0.03);
  --shadow-glow: 0 0 20px oklch(0 0 0 / 0.08);

  --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
}

.dark {
  --background: oklch(0.195 0 0);
  --foreground: oklch(0.94 0 0);
  --card: oklch(0.225 0 0);
  --card-foreground: oklch(0.94 0 0);
  --popover: oklch(0.225 0 0);
  --popover-foreground: oklch(0.94 0 0);
  --primary: oklch(0.94 0 0);
  --primary-foreground: oklch(0.195 0 0);
  --secondary: oklch(0.26 0 0);
  --secondary-foreground: oklch(0.75 0 0);
  --muted: oklch(0.165 0 0);
  --muted-foreground: oklch(0.6 0 0);
  --accent: oklch(0.26 0 0);
  --accent-foreground: oklch(0.94 0 0);
  --destructive: oklch(0.7 0.15 25);
  --border: oklch(0.27 0 0);
  --input: oklch(0.27 0 0);
  --ring: oklch(0.45 0 0);
  --sidebar: oklch(0.175 0 0);
  --sidebar-foreground: oklch(0.78 0 0);
  --sidebar-primary: oklch(0.94 0 0);
  --sidebar-primary-foreground: oklch(0.195 0 0);
  --sidebar-accent: oklch(0.94 0 0 / 0.06);
  --sidebar-accent-foreground: oklch(0.94 0 0);
  --sidebar-border: oklch(0.25 0 0);
  --sidebar-ring: oklch(0.45 0 0);

  --shadow-card:
    inset 0 1px 0 oklch(1 0 0 / 0.04), 0 1px 2px oklch(0 0 0 / 0.2),
    0 0.5px 1px oklch(0 0 0 / 0.15);
  --shadow-float:
    0 0 0 1px oklch(1 0 0 / 0.06), 0 16px 48px -6px oklch(0 0 0 / 0.35),
    0 6px 12px -2px oklch(0 0 0 / 0.2);
  --shadow-composer:
    0 1px 3px oklch(0 0 0 / 0.2), inset 0 1px 0 oklch(1 0 0 / 0.03);
  --shadow-composer-focus:
    0 0 0 1px oklch(1 0 0 / 0.1), 0 4px 16px -4px oklch(0 0 0 / 0.3),
    inset 0 1px 0 oklch(1 0 0 / 0.04);
}

/* ===== Animasi (dari globals.css asli) ===== */
@keyframes fade-up { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@keyframes fade-in { from{opacity:0} to{opacity:1} }
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
@keyframes dot-pulse { 0%,60%,100%{opacity:.3;transform:translateY(0)} 30%{opacity:1;transform:translateY(-3px)} }
@keyframes message-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes thinking-dot { 0%,60%,100%{opacity:.3;transform:translateY(0)} 30%{opacity:1;transform:translateY(-3px)} }
@keyframes glow-pulse {
  0%,100%{box-shadow:0 0 0 0 oklch(0.55 0.12 250 / 0%)}
  50%{box-shadow:0 0 0 3px oklch(0.55 0.12 250 / 8%)}
}
@keyframes subtle-lift {
  from{transform:translateY(0);box-shadow:var(--shadow-card)}
  to{transform:translateY(-1px);box-shadow:var(--shadow-float)}
}

/* ===== Base ===== */
*{box-sizing:border-box;margin:0;border-color:var(--border)}
html,body{height:100%}
body{font-family:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--sidebar);color:var(--foreground);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","ss02","cv01";overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea{font:inherit;color:inherit;background:none;border:0;outline:none;resize:none}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;height:100dvh}

/* ===== Sidebar ===== */
.sidebar{width:260px;background:var(--sidebar);color:var(--sidebar-foreground);display:flex;flex-direction:column;padding:12px 8px;transition:margin .3s var(--ease-spring);flex:none}
.sidebar.closed{margin-left:-260px}
.sb-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:color-mix(in oklab,var(--sidebar-foreground) 60%,transparent);transition:.15s}
.icon-btn:hover{background:var(--sidebar-accent);color:var(--sidebar-foreground)}
.new-chat{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--sidebar-border);border-radius:8px;font-size:13px;font-weight:500;color:color-mix(in oklab,var(--sidebar-foreground) 70%,transparent);transition:.15s;width:100%}
.new-chat:hover{background:var(--sidebar-accent)}
.hist{flex:1;overflow:auto;margin-top:12px}
.hist-label{font-size:11px;padding:4px 10px;color:color-mix(in oklab,var(--sidebar-foreground) 40%,transparent)}
.hist-item{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s;animation:fade-up .25s var(--ease-spring) both}
.hist-item:hover,.hist-item.active{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
.sb-foot{border-top:1px solid var(--sidebar-border);padding-top:8px}

/* ===== Main ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--background);border-radius:16px 0 0 16px;border-left:1px solid color-mix(in oklab,var(--border) 40%,transparent);transition:.3s var(--ease-spring)}
.sidebar.closed + .main{border-radius:0}
header{height:56px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--sidebar)}
.chip{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--border);font-size:13px;color:var(--muted-foreground);transition:.15s}
.chip:hover{color:var(--foreground);background:var(--accent)}
.chat{flex:1;overflow:auto;scroll-behavior:smooth}
.chat-inner{max-width:768px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:24px;min-height:100%}

/* ===== Greeting & saran ===== */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center}
.greet-t{font-size:30px;font-weight:600;letter-spacing:-.02em;opacity:0;animation:greet .5s var(--ease-spring) .35s forwards}
.greet-s{margin-top:12px;font-size:14px;color:color-mix(in oklab,var(--muted-foreground) 80%,transparent);opacity:0;animation:greet .5s var(--ease-spring) .5s forwards}
@keyframes greet{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:32px}
.sug{padding:12px 16px;text-align:left;font-size:12px;line-height:1.6;border-radius:12px;border:1px solid color-mix(in oklab,var(--border) 50%,transparent);background:color-mix(in oklab,var(--card) 30%,transparent);color:var(--muted-foreground);transition:.2s;opacity:0;animation:sugin .4s var(--ease-spring) forwards}
@keyframes sugin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sug:hover{color:var(--foreground);background:var(--accent);animation-fill-mode:forwards;transform:translateY(-1px);box-shadow:var(--shadow-float)}

/* ===== Pesan ===== */
.msg{display:flex;animation:message-in .3s cubic-bezier(.16,1,.3,1) both}
.msg.user{justify-content:flex-end}
.bubble{font-size:13px;line-height:1.65;max-width:80%;white-space:pre-wrap;word-break:break-word}
.user .bubble{background:var(--secondary);padding:8px 14px;border-radius:16px}
.bot{display:flex;gap:12px;align-items:flex-start}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--border);background:var(--card);flex:none;font-size:13px;color:var(--muted-foreground)}
.bot .bubble{max-width:100%;padding-top:4px}
.bot pre{background:var(--muted);padding:12px;border-radius:10px;overflow:auto;margin:8px 0;font:12px/1.6 ui-monospace,"SF Mono",monospace}
.thinking{display:flex;gap:4px;padding:10px 0}
.thinking i{width:5px;height:5px;border-radius:50%;background:var(--muted-foreground);animation:thinking-dot 1.4s ease-in-out infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
.shimmer-text{background:linear-gradient(90deg,var(--muted-foreground) 40%,var(--foreground) 50%,var(--muted-foreground) 60%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2s linear infinite;font-size:13px}
.caret{display:inline-block;width:6px;height:14px;background:var(--foreground);vertical-align:-2px;animation:fade-in .6s ease infinite alternate}

/* ===== Composer ===== */
.composer-wrap{max-width:768px;width:100%;margin:0 auto;padding:0 16px 16px}
.composer{border-radius:16px;border:1px solid color-mix(in oklab,var(--border) 30%,transparent);background:color-mix(in oklab,var(--card) 70%,transparent);box-shadow:var(--shadow-composer);transition:box-shadow .3s}
.composer:focus-within{box-shadow:var(--shadow-composer-focus);animation:glow-pulse 2s ease-in-out infinite}
.composer textarea{display:block;width:100%;min-height:96px;max-height:240px;padding:14px 16px 6px;font-size:13px;line-height:1.6}
.composer textarea::placeholder{color:color-mix(in oklab,var(--muted-foreground) 35%,transparent)}
.c-foot{display:flex;justify-content:space-between;align-items:center;padding:0 12px 12px}
.send{width:28px;height:28px;border-radius:12px;background:var(--foreground);color:var(--background);display:grid;place-items:center;transition:.2s}
.send:hover{opacity:.85}.send:active{transform:scale(.95)}
.send:disabled{background:var(--muted);color:color-mix(in oklab,var(--muted-foreground) 25%,transparent);cursor:not-allowed}
.model{font-size:12px;color:var(--muted-foreground)}

@media(max-width:768px){.sidebar{position:fixed;z-index:20;height:100%;box-shadow:var(--shadow-float)}.main{border-radius:0}.sugs{display:flex;overflow-x:auto}.sug{min-width:200px;white-space:nowrap}}="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <svg class="icon" viewBox="0 0 24 24" style="font-size:16px;opacity:.5;margin-left:8px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <button class="icon-btn" id="toggle" title="Tutup sidebar"><svg viewBox="0 0 24 24" style="font-size:16px"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>
    </div>
    <button class="new-chat" id="newChat"><svg viewBox="0 0 24 24" style="font-size:16px"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>New chat</button>
    <div class="hist" id="hist"><div class="hist-label">Hari ini</div></div>
    <div class="sb-foot"><button class="new-chat" id="theme" style="border:0">Ganti tema</button></div>
  </aside>
  <div class="main">
    <header>
      <button class="icon-btn" id="toggle2" style="color:var(--foreground)"><svg viewBox="0 0 24 24" style="font-size:16px"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>
      <button class="chip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/></svg>Private</button>
    </header>
    <div class="chat" id="chat"><div class="chat-inner" id="inner"></div></div>
    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" placeholder="Ask anything..." rows="1"></textarea>
        <div class="c-foot">
          <span class="model">Demo model</span>
          <button class="send" id="send" disabled><svg viewBox="0 0 24 24" style="font-size:16px"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
