<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tampilan Chat</title>
<style>
:root{--bg:#000;--btn:#2b2b2b;--pill:#3a4650;--blue:#4da3ff;--field:#2f2f2f;--text:#e6e6e6;--mut:#9a9a9a;--call:#2f5bea;--bub:#2f2f2f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--btn:#ececec;--pill:#dde8f3;--blue:#1d6fe0;--field:#f0f0f0;--text:#1a1a1a;--mut:#707070;--bub:#ececec}}
:root[data-theme="light"]{--bg:#fff;--btn:#ececec;--pill:#dde8f3;--blue:#1d6fe0;--field:#f0f0f0;--text:#1a1a1a;--mut:#707070;--bub:#ececec}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;padding:0 14px}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0}
.circ{width:46px;height:46px;border-radius:50%;background:var(--btn);display:grid;place-items:center}
.up{height:46px;border-radius:23px;background:var(--pill);color:var(--blue);padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px}
.up svg{width:20px;height:20px;fill:currentColor;stroke:none}
.sp{flex:1}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:8px 0}
.u{align-self:flex-end;max-width:80%;background:var(--bub);padding:10px 16px;border-radius:20px;font-size:16px;line-height:1.4}
.a{align-self:flex-start;max-width:92%;font-size:16px;line-height:1.5}
.dots{display:flex;gap:5px;padding:8px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--mut);animation:p 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes p{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
.sug{display:flex;flex-direction:column;padding:0 6px 16px}
.sug button{background:none;display:flex;align-items:center;gap:20px;padding:14px 0;font-size:20px;color:var(--text);text-align:left}
.sug svg{width:26px;height:26px}
.bar{display:flex;align-items:center;gap:10px;background:var(--field);border-radius:34px;padding:10px 10px 10px 18px;margin-bottom:10px}
.bar input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-size:19px;outline:none}
.bar input::placeholder{color:var(--mut)}
.bar>button.pl{background:none;display:grid;place-items:center;padding:0}
.go{width:48px;height:48px;border-radius:50%;background:var(--call);color:#fff;display:grid;place-items:center}
.go.snd{background:var(--text);color:var(--bg)}
.hide{display:none!important}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.side{position:fixed;top:0;bottom:0;left:0;width:min(82%,320px);background:var(--bg);border-right:1px solid var(--btn);padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);transform:translateX(-100%);visibility:hidden;transition:transform .25s,visibility .25s}
.open .scrim{opacity:1;visibility:visible}
.open .side{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.scrim,.side{transition:none}}
.side{display:flex;flex-direction:column}
.garis{width:44px;height:4px;border-radius:2px;background:var(--mut);opacity:.6;margin:0 auto 12px;flex:none}
.kosong{flex:1}
.hist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:16px}
.hist button{background:none;text-align:left;padding:12px 8px;font-size:16px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:10px}
.hist button:hover{background:var(--btn)}
.hist button{display:block;width:100%;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.hist .pi{display:none;width:16px;height:16px;margin-right:8px;vertical-align:-2px}
.hist .pin .pi{display:inline-block}
.ren{width:100%;background:var(--field);border:1px solid var(--blue);border-radius:10px;color:var(--text);font:inherit;font-size:16px;padding:10px 8px;outline:none;margin:2px 0}
.mscrim{position:fixed;inset:0}
.ctx{position:fixed;width:min(86vw,300px);background:var(--field);border:1px solid var(--btn);border-radius:24px;padding:8px 6px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.ctx button{background:none;display:flex;align-items:center;gap:18px;width:100%;padding:15px 16px;font-size:19px;color:var(--text);text-align:left;border-radius:16px}
.ctx button:hover{background:var(--btn)}
.ctx .red{color:#ff6b6b}
*{-webkit-tap-highlight-color:transparent}
button,.side,.ctx{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
button::selection,.side ::selection,.ctx ::selection{background:transparent}
.hist button:focus,.hist button:focus-visible,.ctx button:focus,.ctx button:focus-visible{outline:none}
.hist button:active,.hist button:focus-visible{background:var(--btn)}
:root{--frame:#2b2b2b}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--frame:#e6e6e6}}
:root[data-theme="light"]{--frame:#e6e6e6}
body{background:var(--frame)}
.app{background:var(--bg)}
.circ,.bar,.ctx{border:1px solid #454545}
.u{border:1px solid #454545}
.a{overflow-wrap:anywhere}
.a p{margin:0 0 10px}
.a>*:last-child{margin-bottom:0}
.a ol,.a ul{margin:0 0 10px;padding-left:22px}
.a li{margin:5px 0}
.a strong{font-weight:650}
.a pre{background:var(--field);border:1px solid #454545;border-radius:12px;padding:12px;overflow-x:auto;margin:0 0 10px;font-size:14px;line-height:1.45}
.a code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}
.a :not(pre)>code{background:var(--field);padding:2px 6px;border-radius:6px}
.a.ia{width:min(210px,92%)}
.imgbox{position:relative;width:100%;aspect-ratio:1/1;border-radius:18px;background:#05070d;border:1px solid #454545;overflow:hidden;display:grid;place-items:center}
.imgbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.imgbox.ok img{opacity:1}
.imgbox canvas{position:absolute;inset:0;width:100%;height:100%}
.imgbox .pct{position:absolute;right:10px;bottom:10px;background:rgba(58,58,58,.92);color:#c8d6ff;border-radius:999px;padding:5px 12px;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.imgbox.ok canvas,.imgbox.ok .pct,.imgbox.bad canvas,.imgbox.bad .pct{display:none}
.imgbox .err{display:none;padding:12px;text-align:center;color:var(--mut);font-size:14px}
.imgbox.bad .err{display:block}
.imgbox .err button{display:block;margin:12px auto 0;background:var(--btn);color:var(--text);border-radius:18px;padding:8px 18px;font-size:15px}
.imgcap{font-size:13px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="circ" id="menu" aria-label="Buka menu"><svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h10"/></svg></button>
    <div class="sp"></div>
    <button class="circ" id="new" aria-label="Obrolan baru"><svg viewBox="0 0 24 24"><path d="M12 3.5c-5 0-9 3.4-9 7.6 0 1.8.7 3.4 2 4.7L4 20l4.3-1.8c1.1.4 2.4.6 3.7.6 5 0 9-3.4 9-7.6s-4-7.7-9-7.7z"/></svg></button>
  </div>
  <div id="log"></div>
  <div class="sug hide" id="sug">
    <button data-q="Buatkan gambar "><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="16" cy="8.5" r="1.6"/><path d="M3.5 16l5-4.5 4.5 4 3-2.5 4.5 4"/></svg>Buat gambar</button>
    <button data-q="Tolong tulis atau edit "><svg viewBox="0 0 24 24"><path d="M16.5 3.5l4 4L8 20l-5 1 1-5z"/></svg>Tulis atau edit</button>
    <button data-q="Cari di web: "><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>Cari di web</button>
  </div>
  <div class="bar">
    <button class="pl" id="plus" aria-label="Tambah" aria-expanded="false"><svg viewBox="0 0 24 24" style="width:30px;height:30px"><path d="M12 4v16M4 12h16"/></svg></button>
    <input id="t" placeholder="Tanya apa saja" autocomplete="off" aria-label="Tulis pesan">
    <button class="pl" id="mic" aria-label="Mikrofon"><svg viewBox="0 0 24 24" style="width:28px;height:28px"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
    <button class="go" id="go" aria-label="Panggilan suara"><svg viewBox="0 0 24 24" id="ic"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 006 6L16 13l5 2v4a2 2 0 01-2 2A16 16 0 013 5a2 2 0 012-2z"/></svg></button>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<nav class="side" id="side" aria-label="Menu samping">
  <div class="kosong"></div>
  <div class="garis" role="separator"></div>
  <div class="hist" id="hist" aria-label="Riwayat chat">
  </div>
</nav>
<div class="mscrim hide" id="mscrim"></div>
<div class="ctx hide" id="ctx" role="menu">
  <button id="m-pin" role="menuitem"><svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3zM12 15v6"/></svg><span id="m-pin-t">Sematkan</span></button>
  <button id="m-ren" role="menuitem"><svg viewBox="0 0 24 24"><path d="M16.5 3.5l4 4L8 20l-5 1 1-5z"/></svg><span>Ganti nama</span></button>
  <button id="m-del" class="red" role="menuitem"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>Hapus</span></button>
</div>
<script>
const $=id=>document.getElementById(id),log=$('log'),t=$('t'),go=$('go'),ic=$('ic'),H=$('hist');
const PHONE='<path d="M5 3h4l2 5-2.5 1.5a11 11 0 006 6L16 13l5 2v4a2 2 0 01-2 2A16 16 0 013 5a2 2 0 012-2z"/>',ARROW='<path d="M12 19V5M5 12l7-7 7 7"/>';
const SUPABASE_URL='https://adxyijyerblmosdzsbyp.supabase.co',SUPABASE_ANON_KEY='sb_publishable_bCG2DJjBfLAMp2ME9Pe3cQ_jbPmlnnX';
const KEY='chat_state_v1';let chats=[],cur=null,busy=false;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.chats)){chats=s.chats.filter(c=>c&&c.id&&Array.isArray(c.msgs));cur=s.cur}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({chats,cur}))}catch(e){}}
const get=id=>chats.find(c=>c.id===id);
function sync(){const has=t.value.trim()!=='';go.classList.toggle('snd',has);ic.innerHTML=has?ARROW:PHONE;$('mic').classList.toggle('hide',has);go.setAttribute('aria-label',has?'Kirim pesan':'Panggilan suara')}
function esc(x){return x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inl(x){return esc(x).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>')}
function md(src){
if(src.indexOf('\n')<0)src=src.replace(/\s+(\d{1,2}\.\s+\*\*)/g,'\n$1');
const lines=src.replace(/\r/g,'').split('\n');let out='',list=null,para=[],code=null,m;
const fp=()=>{if(para.length){out+='<p>'+para.map(inl).join('<br>')+'</p>';para=[]}};
const fl=()=>{if(list){out+='</'+list+'>';list=null}};
for(const ln of lines){
if(ln.trim().startsWith('```')){if(code===null){fp();fl();code=[]}else{out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';code=null}continue}
if(code!==null){code.push(ln);continue}
if(!ln.trim()){fp();fl();continue}
if(m=ln.match(/^\s*(\d+)[.)]\s+(.*)/)){fp();if(list!=='ol'){fl();list='ol';out+='<ol start="'+m[1]+'">'}out+='<li>'+inl(m[2])+'</li>';continue}
if(m=ln.match(/^\s*[-*\u2022]\s+(.*)/)){fp();if(list!=='ul'){fl();list='ul';out+='<ul>'}out+='<li>'+inl(m[1])+'</li>';continue}
if(m=ln.match(/^#{1,6}\s+(.*)/)){fp();fl();out+='<p><strong>'+inl(m[1])+'</strong></p>';continue}
fl();para.push(ln)}
if(code!==null)out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';
fp();fl();return out}
function add(txt,c){const d=document.createElement('div');d.className=c;if(c==='a'&&txt)d.innerHTML=md(txt);else d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
const IMG_BASE='https://image.pollinations.ai/prompt/';
const IMG_ALT='https://gen.pollinations.ai/image/';
const IMG1=/^\s*(\S+\s+){0,4}?(buat\w*|bikin\w*|gambar(in|kan)?|lukis\w*|generate|create|draw|make|minta|mau|pengen|ingin|bisa)\s+(\S+\s+){0,3}?(gambar|foto|logo|ilustrasi|lukisan|poster|wallpaper|ikon|icon|banner|image|picture)\b/i,IMG2=/^\s*gambar(in|kan)?\s+\S/i,NOIMG=/\b(kode|code|script|html|css|program|fungsi|cara|rumus|artinya|apa itu)\b/i;
const isImg=v=>v.length<300&&!NOIMG.test(v)&&(IMG1.test(v)||IMG2.test(v));
const imgPrompt=v=>{let r=v;for(let i=0;i<4;i++)r=r.replace(/^\s*(tolong|bisa|dong|aku|saya|mau|pengen|ingin|minta|buat\w*|bikin\w*|gambar(in|kan)?|lukis\w*|generate|create|draw|make|sebuah|satu)\s+/i,'');return r.trim()||v};
const imgUrl=p=>IMG_BASE+encodeURIComponent(p)+'?width=768&height=768&nologo=true&model=flux&seed='+Math.floor(Math.random()*1e9);
function addImg(url,p){
const d=document.createElement('div');d.className='a ia';
const box=document.createElement('div');box.className='imgbox';
const cv=document.createElement('canvas');
const pc=document.createElement('div');pc.className='pct';pc.textContent='0%';
const err=document.createElement('div');err.className='err';err.textContent='Gambar gagal dibuat.';
const rb=document.createElement('button');rb.textContent='Coba lagi';err.appendChild(rb);
const im=new Image();im.alt=p;
box.append(cv,pc,im,err);
const cap=document.createElement('div');cap.className='imgcap';cap.textContent=p;
d.append(box,cap);log.appendChild(d);log.scrollTop=log.scrollHeight;
let v=0,tm=0,tt=0,n=0,raf=0,tries=0;
const draw=ts=>{const w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;const dpr=devicePixelRatio||1,W=Math.round(w*dpr);
if(cv.width!==W){cv.width=W;cv.height=Math.round(h*dpr)}
const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
const t=ts/1000,sp=11,s2=Math.min(w,h)*0.24;
const bl=[[w*(.5+.28*Math.sin(t*.9)),h*(.5+.25*Math.sin(t*.7+1))],[w*(.5+.3*Math.sin(t*.6+2.5)),h*(.5+.28*Math.cos(t*.8))]];
for(let y=sp/2;y<h;y+=sp)for(let x=sp/2;x<w;x+=sp){let I=0;for(const b of bl){const dx=x-b[0],dy=y-b[1];I+=Math.exp(-(dx*dx+dy*dy)/(2*s2*s2))}
I=Math.min(I,1);g.fillStyle='rgba(59,108,240,'+(0.12+0.88*I).toFixed(2)+')';g.beginPath();g.arc(x,y,0.7+2.4*I,0,6.2832);g.fill()}};
const loop=ts=>{draw(ts);raf=requestAnimationFrame(loop)};
const stop=()=>{clearInterval(tm);clearTimeout(tt);cancelAnimationFrame(raf)};
const fail=()=>{stop();box.classList.add('bad')};
const fb=()=>{if(tries++===0&&url.indexOf(IMG_BASE)===0){clearTimeout(tt);tt=setTimeout(fail,50000);im.src=url.replace(IMG_BASE,IMG_ALT)+'&f=1'}else fail()};
const start=()=>{stop();box.classList.remove('ok','bad');v=0;pc.textContent='0%';
if(matchMedia('(prefers-reduced-motion:reduce)').matches)draw(1500);else raf=requestAnimationFrame(loop);
tm=setInterval(()=>{v+=(92-v)*0.05+0.2;if(v>92)v=92;pc.textContent=Math.floor(v)+'%'},300);
tries=0;tt=setTimeout(fb,40000);im.src=url+(n++?'&r='+Date.now():'')};
im.onload=()=>{stop();pc.textContent='100%';box.classList.add('ok')};
im.onerror=fb;rb.onclick=start;start();return d}
function mk(c){const b=document.createElement('button');b.dataset.id=c.id;if(c.pin)b.classList.add('pin');b.innerHTML='<svg class="pi" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3zM12 15v6"/></svg><span class="tx"></span>';b.querySelector('.tx').textContent=c.title;return b}
function renderHist(){H.innerHTML='';[...chats.filter(c=>c.pin),...chats.filter(c=>!c.pin)].forEach(c=>H.appendChild(mk(c)))}
function renderLog(){log.innerHTML='';const c=get(cur);if(!c){cur=null;return}c.msgs.forEach(m=>m.img?addImg(m.img,m.prompt):add(m.content,m.role==='user'?'u':'a'))}
async function ask(d,c){
try{
const r=await fetch(SUPABASE_URL+'/functions/v1/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_ANON_KEY,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({messages:c.msgs.slice(-20)})});
const j=await r.json().catch(()=>({}));
if(!r.ok||!j.reply)throw new Error(j.error||('Kode '+r.status));
c.msgs.push({role:'assistant',content:j.reply});save();
if(cur===c.id)d.innerHTML=md(j.reply);
}catch(e){if(cur===c.id)d.textContent='Maaf, gagal menghubungi server: '+e.message}
busy=false;log.scrollTop=log.scrollHeight}
function send(){if(busy)return;const v=t.value.trim();if(!v)return;$('sug').classList.add('hide');
let c=get(cur);if(!c){c={id:Date.now().toString(36),title:v.slice(0,60),pin:false,msgs:[]};chats.unshift(c);cur=c.id;renderHist();renderLog()}
c.msgs.push({role:'user',content:v});save();add(v,'u');t.value='';sync();
if(isImg(v)){const pr=imgPrompt(v),u=imgUrl(pr);c.msgs.push({role:'assistant',content:'[Gambar dibuat: '+pr+']',img:u,prompt:pr});save();addImg(u,pr);return}
const d=add('','a');d.innerHTML='<div class="dots"><i></i><i></i><i></i></div>';busy=true;ask(d,c)}
go.onclick=()=>{if(t.value.trim())send()};
t.addEventListener('input',sync);t.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
document.querySelectorAll('.sug button').forEach(b=>b.onclick=()=>{t.value=b.dataset.q;$('sug').classList.add('hide');$('plus').setAttribute('aria-expanded','false');t.focus();sync()});
$('new').onclick=()=>{cur=null;save();renderLog();$('sug').classList.add('hide');$('plus').setAttribute('aria-expanded','false');t.value='';sync()};
const body=document.body,tog=o=>{body.classList.toggle('open',o);$('menu').setAttribute('aria-expanded',String(o))};
$('menu').onclick=()=>tog(true);
const ctx=$('ctx'),ms=$('mscrim');let tgt=null,lp=false,tm=0,sx=0,sy=0;
function closeCtx(){ctx.classList.add('hide');ms.classList.add('hide');tgt=null}
function openCtx(b){tgt=b;$('m-pin-t').textContent=b.classList.contains('pin')?'Lepas sematan':'Sematkan';ms.classList.remove('hide');ctx.classList.remove('hide');const r=b.getBoundingClientRect(),h=ctx.offsetHeight,w=ctx.offsetWidth;let top=r.bottom+6;if(top+h>innerHeight-12)top=r.top-h-6;ctx.style.top=Math.max(8,top)+'px';ctx.style.left=Math.max(12,Math.min(r.left+8,innerWidth-w-12))+'px'}
H.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;lp=false;sx=e.clientX;sy=e.clientY;clearTimeout(tm);tm=setTimeout(()=>{lp=true;openCtx(b)},500)});
['pointerup','pointercancel','pointerleave'].forEach(n=>H.addEventListener(n,()=>clearTimeout(tm)));
H.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)clearTimeout(tm)});
H.addEventListener('contextmenu',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();if(tgt!==b)openCtx(b)});
H.addEventListener('click',e=>{if(lp){lp=false;return}const b=e.target.closest('button');if(!b)return;if(get(b.dataset.id)){cur=b.dataset.id;save();renderLog();$('sug').classList.add('hide')}tog(false)});
ms.onclick=closeCtx;
addEventListener('keydown',e=>{if(e.key==='Escape')closeCtx()});
$('m-pin').onclick=()=>{const c=get(tgt.dataset.id);closeCtx();if(!c)return;c.pin=!c.pin;chats=chats.filter(x=>x!==c);chats.unshift(c);save();renderHist()};
$('m-del').onclick=()=>{const id=tgt.dataset.id;closeCtx();chats=chats.filter(c=>c.id!==id);if(cur===id){cur=null;renderLog()}save();renderHist()};
$('m-ren').onclick=()=>{const b=tgt,c=get(b.dataset.id);closeCtx();if(!c)return;const i=document.createElement('input');i.className='ren';i.value=c.title;i.setAttribute('aria-label','Nama baru');b.replaceWith(i);i.focus();i.select();let d=0;const end=ok=>{if(d)return;d=1;const v=i.value.trim();if(ok&&v){c.title=v;save()}renderHist()};i.onkeydown=e=>{if(e.key==='Enter')end(1);if(e.key==='Escape'){e.stopPropagation();end(0)}};i.onblur=()=>end(1)};
$('scrim').onclick=()=>tog(false);
addEventListener('keydown',e=>{if(e.key==='Escape')tog(false)});
$('plus').onclick=()=>{const h=$('sug').classList.toggle('hide');$('plus').setAttribute('aria-expanded',String(!h))};
load();renderHist();renderLog();sync();
</script>
</body>
</html>
