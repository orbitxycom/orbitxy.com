<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome</title>
<link rel="icon" type="image/png" href="https://orbitxy.com/bekkiV1.png?v=20261107c">
<link rel="apple-touch-icon" href="https://orbitxy.com/bekkiV1.png?v=20261107c">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bekki">
<style>
  :root {
    --bg: #ffffff;
    --ink: #000000;
    --panel: #000000;
    --btn-google: #252525;
    --btn-h: 52px;
    --btn-radius: 14px;
    --gap: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .screen {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }

  /* Center headline */
  .hero {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 24px 120px;
  }
  .headline {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: clamp(28px, 7.5vw, 40px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    white-space: nowrap;
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .logo { width: 64px; height: 64px; object-fit: contain; display: block; }
  .dot {
    width: 0.92em;
    height: 0.92em;
    border-radius: 50%;
    background: var(--ink);
    flex: none;
    transform: translateY(0.04em);
  }

  /* Bottom panel */
  .panel {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    background: var(--panel);
    border-radius: 40px 40px 0 0;
    padding: 24px 24px calc(env(safe-area-inset-bottom, 0px) + 76px);
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  .btn {
    width: 100%;
    height: var(--btn-h);
    border-radius: var(--btn-radius);
    border: 1px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font: inherit;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: transform .12s ease, opacity .12s ease;
  }
  .btn:active { transform: scale(.98); opacity: .85; }
  .btn svg { width: 20px; height: 20px; flex: none; }

  .btn-google { background: var(--btn-google); color: #fff; }

  .or { display: flex; align-items: center; gap: 12px; color: #8a8a8a; font-size: 13px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: #2e2e2e; }
  .manual { display: flex; flex-direction: column; gap: var(--gap); }
  .field {
    width: 100%; height: var(--btn-h); border-radius: var(--btn-radius);
    border: 1px solid #333; background: #1b1b1b; color: #fff;
    padding: 0 16px; font: inherit; font-size: 16px; outline: none;
  }
  .field::placeholder { color: #8a8a8a; }
  .field:focus { border-color: #888; }
  /* Tombol Continue: di kanan bawah kotak email, baru muncul kalau sudah ada huruf */
  .btn-main {
    align-self: flex-end; width: auto; min-width: 116px; height: 44px; padding: 0 22px; border-radius: 12px;
    background: #fff; color: #000; font-size: 16px;
    visibility: hidden; opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease, visibility .18s;
  }
  .btn-main.show { visibility: visible; opacity: 1; transform: none; pointer-events: auto; }
  .step { display: flex; flex-direction: column; gap: var(--gap); }
  .step[hidden] { display: none; }
  .hint { color: #bdbdbd; font-size: 14px; line-height: 1.5; text-align: center; }
  .hint b { color: #fff; font-weight: 500; overflow-wrap: anywhere; }
  .field.code { text-align: center; font-size: 26px; font-weight: 600; letter-spacing: .5em; padding: 0 0 0 .5em; }
  .field.code::placeholder { letter-spacing: .5em; font-weight: 400; }
  .row { display: flex; justify-content: space-between; gap: 12px; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .link { background: none; border: 0; color: #bdbdbd; font: inherit; font-size: 14px; cursor: pointer; text-align: center; padding: 4px; }
  .link:hover { color: #fff; }
  .ok { color: #9be3a8 !important; }

  .err { color: #ff9b9b; font-size: 14px; text-align: center; line-height: 1.4; }
  .err:empty { display: none; }

  .btn:focus-visible { outline: 2px solid #4c8dff; outline-offset: 2px; }

  /* HP: panel hitam dinaikkan sampai sekitar separuh layar */
  @media (max-width: 639px) {
    .panel { min-height: 52dvh; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 36px); }
    .hero { padding-bottom: 0; }
  }

  /* Tablet / desktop: panel as floating card */
  @media (min-width: 640px) {
    .panel { border-radius: 40px; margin-bottom: 32px; padding-bottom: 32px; }
  }
  @media (max-height: 560px) {
    .hero { padding-bottom: 40px; }
    :root { --btn-h: 46px; --gap: 10px; }
  }

  /* Laptop / desktop: kotak di kiri, teks di kanan */
  @media (min-width: 900px) {
    .screen { flex-direction: row; align-items: center; justify-content: center; gap: 6vw; padding: 0 6vw; }
    .panel { order: 1; flex: none; margin: 0; max-width: 460px; padding-bottom: 32px; min-height: 380px; }
    .hero { order: 2; flex: 1; padding: 0; justify-content: center; }
    .headline { font-size: clamp(36px, 4vw, 56px); }
  }
</style>
</head>
<body>
  <main class="screen">
    <section class="hero">
      <div class="brand">
        <img class="logo" src="https://orbitxy.com/bekkiV1.png?v=20261107c" alt="Bekki" width="64" height="64" onerror="this.style.display='none'">
        <h1 class="headline">Let’s brainstorm<span class="dot" aria-hidden="true"></span></h1>
      </div>
    </section>

    <section class="panel" aria-label="Masuk">
      <!-- Pakai id/class login Google lama Anda di tombol ini jika perlu -->
      <button class="btn btn-google" id="btn-google" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/>
          <path fill="#FBBC05" d="M10.5 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.2C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.2z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

      <div class="or" aria-hidden="true">atau</div>

      <form class="manual" id="manual" novalidate>
        <div class="step" id="step1">
          <input class="field" id="email" type="email" inputmode="email" autocomplete="email" placeholder="Email" aria-label="Email">
          <button class="btn btn-main" id="btn-manual" type="submit">Continue</button>
        </div>

        <div class="step" id="step2" hidden>
          <p class="hint">Masukkan kode <span id="lenShow">6</span> digit yang kami kirim ke <b id="emailShow"></b></p>
          <input class="field code" id="code" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" aria-label="Kode verifikasi">
          <div class="row">
            <button class="link" id="resend" type="button">Kirim ulang kode</button>
            <button class="link" id="change" type="button">Ganti email</button>
          </div>
        </div>
      </form>

      <p class="err" id="login-err" role="alert"></p>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
  // Login lewat Supabase: Google, atau email + kode yang dikirim ke email. Setelah berhasil, ke /ai/
  (function () {
    var URL_ = "https://adxyijyerblmosdzsbyp.supabase.co";
    var KEY = "sb_publishable_bCG2DJjBfLAMp2ME9Pe3cQ_jbPmlnnX";
    var CODE_LEN = 6; // Supabase hanya mengizinkan kode 6 sampai 10 digit (minimal 6)
    var $ = function (id) { return document.getElementById(id); };
    var err = $("login-err"), btn = $("btn-google"), form = $("manual"), mainBtn = $("btn-manual");
    var emailEl = $("email"), codeEl = $("code"), step1 = $("step1"), step2 = $("step2"), resend = $("resend"), change = $("change");
    var sentTo = "", busy = false, cool = 0, coolT = null;
    var sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(URL_, KEY) : null;

    codeEl.maxLength = CODE_LEN; $("lenShow").textContent = CODE_LEN;
    function say(t, ok) { err.textContent = t || ""; err.className = "err" + (ok ? " ok" : ""); }
    if (!sb) say("Gagal memuat sistem login. Cek koneksi internet, lalu muat ulang halaman.");
    else sb.auth.getSession().then(function (r) { if (r && r.data && r.data.session) location.replace("/ai/"); });

    window.handleGoogleLogin = async function () {
      if (!sb) return;
      say(""); btn.disabled = true;
      var res = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + "/ai/" } });
      if (res && res.error) { say("Login Google gagal. Coba lagi sebentar ya."); btn.disabled = false; }
    };

    // Tombol Continue baru muncul kalau ada satu huruf saja di kolom email
    function sinkron() { mainBtn.classList.toggle("show", !!emailEl.value); }
    ["input", "change", "keyup"].forEach(function (ev) { emailEl.addEventListener(ev, sinkron); });
    setTimeout(sinkron, 300); setTimeout(sinkron, 1200); // isi otomatis dari browser
    sinkron();

    function pesan(m) {
      m = String(m || "").toLowerCase();
      if (m.indexOf("email") > -1 && m.indexOf("invalid") > -1) return "Alamat email tidak valid.";
      if (m.indexOf("expired") > -1 || m.indexOf("invalid") > -1) return "Kode salah atau sudah kedaluwarsa.";
      if (m.indexOf("rate limit") > -1 || m.indexOf("too many") > -1 || m.indexOf("for security purposes") > -1) return "Terlalu sering meminta kode. Tunggu sebentar, lalu coba lagi.";
      if (m.indexOf("failed to fetch") > -1 || m.indexOf("network") > -1) return "Sepertinya sinyal Anda bermasalah. Cek koneksi internet, lalu coba lagi.";
      return "Gagal. Coba lagi sebentar ya.";
    }

    function mulaiCooldown(n) {
      cool = n; clearInterval(coolT);
      function tampil() { resend.disabled = cool > 0; resend.textContent = cool > 0 ? "Kirim ulang kode (" + cool + ")" : "Kirim ulang kode"; resend.style.opacity = cool > 0 ? ".5" : ""; }
      tampil();
      coolT = setInterval(function () { cool--; tampil(); if (cool <= 0) clearInterval(coolT); }, 1000);
    }

    async function kirimKode(ulang) {
      var email = ulang ? sentTo : emailEl.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { say("Isi email dengan benar."); return; }
      say(""); mainBtn.disabled = true;
      try {
        var res = await sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: true } });
        if (res.error) { say(pesan(res.error.message)); }
        else {
          sentTo = email; mulaiCooldown(60);
          step1.hidden = true; step2.hidden = false;
          $("emailShow").textContent = sentTo; codeEl.value = ""; codeEl.focus();
          say(ulang ? "Kode baru sudah dikirim." : "Kode sudah dikirim. Cek email Anda.", true);
        }
      } catch (x) { say(pesan(x && x.message)); }
      mainBtn.disabled = false;
    }

    async function verifikasi() {
      var kode = codeEl.value.replace(/\D/g, "");
      if (kode.length !== CODE_LEN || busy) return;
      busy = true; codeEl.disabled = true; say("");
      try {
        var res = await sb.auth.verifyOtp({ email: sentTo, token: kode, type: "email" });
        if (res.error) { say(pesan(res.error.message)); codeEl.value = ""; }
        else { location.replace("/ai/"); return; }
      } catch (x) { say(pesan(x && x.message)); }
      busy = false; codeEl.disabled = false; codeEl.focus();
    }

    codeEl.addEventListener("input", function () {
      codeEl.value = codeEl.value.replace(/\D/g, "").slice(0, CODE_LEN);
      say("");
      if (codeEl.value.length === CODE_LEN) verifikasi();
    });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!sb) return;
      if (!step2.hidden) verifikasi(); else kirimKode(false);
    });
    resend.onclick = function () { if (cool <= 0 && sb) kirimKode(true); };
    change.onclick = function () {
      clearInterval(coolT); step2.hidden = true; step1.hidden = false;
      codeEl.value = ""; say(""); emailEl.focus();
    };
  })();
</script>
<script>
  // Hook aman: tidak menimpa fungsi login Google yang sudah ada.
  // Jika proyek Anda punya handler (mis. window.handleGoogleLogin), akan dipanggil.
  // Jika Anda sudah memasang listener sendiri pada #btn-google, tetap berjalan normal.
  (function () {
    const $ = (id) => document.getElementById(id);

    $('btn-google').addEventListener('click', function () {
      if (typeof window.handleGoogleLogin === 'function') window.handleGoogleLogin();
      else document.dispatchEvent(new CustomEvent('auth:google'));
    });
  })();
</script>
<script>
  // Daftarkan service worker supaya situs bisa dipasang sebagai aplikasi
  if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("../sw.js").catch(function () {}); });
</script>
</body>
</html>
