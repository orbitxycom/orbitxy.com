<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>OrbitXY Race Car</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050609;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: monospace;
  touch-action: none;
}

#gameContainer {
  position: relative;
  width: 100vw;
  height: 100vh;
  width: 100dvw;
  height: 100dvh;
  overflow: hidden;
  background: #111;
}

#gameCanvas {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

/* =========================
   START / RESTART
========================= */

.gameButton {
  position: absolute;

  left: 50%;
  top: 80%;

  transform: translate(-50%, -50%);

  min-width: 190px;

  padding: 16px 35px;

  border: 2px solid #fff;
  border-radius: 8px;

  background: #ff9d00;
  color: #111;

  font-family: monospace;
  font-size: 22px;
  font-weight: bold;

  cursor: pointer;
  z-index: 20;

  box-shadow:
    0 0 20px rgba(255,157,0,.35);
}

.gameButton:active {
  transform:
    translate(-50%, -50%)
    scale(.94);
}

#restartButton {
  display: none;
}
</style>
</head>

<body>

<div id="gameContainer">

<canvas
  id="gameCanvas"
  width="360"
  height="640">
</canvas>

<button
  id="startButton"
  class="gameButton">
  START
</button>

<button
  id="restartButton"
  class="gameButton">
  RESTART
</button>

</div>

<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
  document.getElementById("gameCanvas");

const ctx =
  canvas.getContext("2d");

const startButton =
  document.getElementById("startButton");

const restartButton =
  document.getElementById("restartButton");


const GAME_WIDTH = 360;
const GAME_HEIGHT = 640;

canvas.width = GAME_WIDTH;
canvas.height = GAME_HEIGHT;


/* =====================================================
   LANES
===================================================== */

const LANES = [
  95,
  180,
  265
];


/* =====================================================
   GAME VARIABLES
===================================================== */

let gameState = "START";

let level = 1;

let score = 0;

let lives = 2;

let speed = 3;

let levelTime = 10;

let spawnTimer = 0;

let roadOffset = 0;

let invincible = 0;

let lastTime = 0;

let enemies = [];

let boss = null;


/* =====================================================
   PLAYER
===================================================== */

const player = {

  lane: 1,

  x: LANES[1],

  targetX: LANES[1],

  y: 535,

  width: 34,

  height: 62

};


/* =====================================================
   RESPONSIVE
===================================================== */

function resizeCanvas() {

  const screenWidth =
    window.innerWidth;

  const screenHeight =
    window.innerHeight;

  const screenRatio =
    screenWidth / screenHeight;

  const gameRatio =
    GAME_WIDTH / GAME_HEIGHT;


  if (screenRatio > gameRatio) {

    canvas.style.height =
      "100vh";

    canvas.style.width =
      "auto";

  } else {

    canvas.style.width =
      "100vw";

    canvas.style.height =
      "auto";

  }

}

window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();


/* =====================================================
   START
===================================================== */

function startGame() {

  gameState = "PLAYING";

  level = 1;

  score = 0;

  lives = 2;

  speed = 3;

  levelTime = 10;

  spawnTimer = 0;

  roadOffset = 0;

  invincible = 0;

  enemies = [];

  boss = null;


  player.lane = 1;

  player.x = LANES[1];

  player.targetX = LANES[1];


  startButton.style.display =
    "none";

  restartButton.style.display =
    "none";


  lastTime =
    performance.now();


  requestAnimationFrame(
    gameLoop
  );

}


/* =====================================================
   RESTART
===================================================== */

function restartGame() {
  startGame();
}


/* =====================================================
   MOVE LEFT
===================================================== */

function moveLeft() {

  if (
    gameState !== "PLAYING"
  ) return;


  if (
    player.lane > 0
  ) {

    player.lane--;

    player.targetX =
      LANES[player.lane];

  }

}


/* =====================================================
   MOVE RIGHT
===================================================== */

function moveRight() {

  if (
    gameState !== "PLAYING"
  ) return;


  if (
    player.lane < 2
  ) {

    player.lane++;

    player.targetX =
      LANES[player.lane];

  }

}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "ArrowLeft"
    ) {

      e.preventDefault();

      moveLeft();

    }


    if (
      e.key === "ArrowRight"
    ) {

      e.preventDefault();

      moveRight();

    }


    if (
      e.key === "Enter" &&
      gameState === "START"
    ) {

      startGame();

    }


    if (
      e.key === "Enter" &&
      (
        gameState === "GAMEOVER" ||
        gameState === "WIN"
      )
    ) {

      restartGame();

    }

  }
);


/* =====================================================
   TOUCH SCREEN
===================================================== */

canvas.addEventListener(
  "pointerdown",
  function(e) {

    if (
      gameState !== "PLAYING"
    ) return;


    const rect =
      canvas.getBoundingClientRect();


    const x =
      e.clientX - rect.left;


    const relativeX =
      x / rect.width;


    if (
      relativeX < 0.5
    ) {

      moveLeft();

    } else {

      moveRight();

    }

  },
  {
    passive: true
  }
);


/* =====================================================
   CREATE ENEMY
===================================================== */

function createEnemy() {

  const lane =
    Math.floor(
      Math.random() * 3
    );


  enemies.push({

    lane: lane,

    x: LANES[lane],

    y: -90,

    width: 34,

    height: 62,

    speed:
      speed +
      Math.random() * 1.3

  });

}


/* =====================================================
   CREATE BOSS
===================================================== */

function createBoss() {

  boss = {

    x: LANES[1],

    targetX: LANES[1],

    y: -120,

    width: 52,

    height: 82,

    speed: 2.2

  };

}


/* =====================================================
   COLLISION
===================================================== */

function collision(a, b) {

  return (

    a.x - a.width / 2 <
      b.x + b.width / 2 &&

    a.x + a.width / 2 >
      b.x - b.width / 2 &&

    a.y - a.height / 2 <
      b.y + b.height / 2 &&

    a.y + a.height / 2 >
      b.y - b.height / 2

  );

}


/* =====================================================
   LOSE LIFE
===================================================== */

function loseLife() {

  if (
    invincible > 0
  ) return;


  lives--;

  invincible = 75;


  if (
    lives <= 0
  ) {

    gameState = "GAMEOVER";

    restartButton.style.display =
      "block";

  }

}


/* =====================================================
   UPDATE
===================================================== */

function updateGame(delta) {

  if (
    gameState !== "PLAYING"
  ) return;


  /* PLAYER */

  player.x +=
    (
      player.targetX -
      player.x
    ) *
    Math.min(
      1,
      delta * 12
    );


  /* INVINCIBILITY */

  if (
    invincible > 0
  ) {

    invincible -=
      delta * 60;

  }


  /* ROAD */

  roadOffset +=
    speed *
    delta *
    60;


  if (
    roadOffset >= 48
  ) {

    roadOffset = 0;

  }


  /* TIMER */

  levelTime -= delta;


  if (
    levelTime <= 0
  ) {

    if (
      level === 1
    ) {

      level = 2;

      levelTime = 20;

      speed = 4;

      enemies = [];

      createBoss();

    } else {

      gameState = "WIN";

      restartButton.style.display =
        "block";

      return;

    }

  }


  /* SPAWN */

  spawnTimer -= delta;


  if (
    spawnTimer <= 0
  ) {

    createEnemy();

    spawnTimer =
      level === 1
      ? 0.8
      : 0.6;

  }


  /* ENEMIES */

  for (
    let i =
      enemies.length - 1;

    i >= 0;

    i--
  ) {

    const enemy =
      enemies[i];


    enemy.y +=
      enemy.speed *
      delta *
      60;


    if (
      enemy.y >
      GAME_HEIGHT + 100
    ) {

      enemies.splice(
        i,
        1
      );

      score++;

      continue;

    }


    if (
      collision(
        player,
        enemy
      )
    ) {

      enemies.splice(
        i,
        1
      );

      loseLife();

    }

  }


  /* BOSS */

  if (boss) {

    boss.y +=
      boss.speed *
      delta *
      60;


    if (
      boss.y >
      GAME_HEIGHT + 130
    ) {

      boss.y = -130;

    }


    boss.targetX =
      LANES[player.lane];


    boss.x +=
      (
        boss.targetX -
        boss.x
      ) *
      delta *
      2;


    if (
      collision(
        player,
        boss
      )
    ) {

      loseLife();

    }

  }

}


/* =====================================================
   ROAD
===================================================== */

function drawRoad() {

  ctx.fillStyle =
    "#101114";

  ctx.fillRect(
    0,
    0,
    GAME_WIDTH,
    GAME_HEIGHT
  );


  ctx.fillStyle =
    "#303236";

  ctx.fillRect(
    35,
    0,
    290,
    GAME_HEIGHT
  );


  ctx.fillStyle =
    "#eeeeee";

  ctx.fillRect(
    35,
    0,
    6,
    GAME_HEIGHT
  );

  ctx.fillRect(
    319,
    0,
    6,
    GAME_HEIGHT
  );


  for (
    let y =
      -48 + roadOffset;

    y < GAME_HEIGHT;

    y += 48
  ) {

    ctx.fillRect(
      134,
      y,
      5,
      25
    );

    ctx.fillRect(
      221,
      y,
      5,
      25
    );

  }

}


/* =====================================================
   CAR
===================================================== */

function drawCar(
  x,
  y,
  width,
  height,
  color,
  isBoss = false
) {

  ctx.save();

  ctx.translate(
    x,
    y
  );


  /* WHEELS */

  ctx.fillStyle =
    "#090909";


  ctx.fillRect(
    -width / 2 - 4,
    -height / 2 + 10,
    8,
    22
  );


  ctx.fillRect(
    width / 2 - 4,
    -height / 2 + 10,
    8,
    22
  );


  ctx.fillRect(
    -width / 2 - 4,
    height / 2 - 32,
    8,
    22
  );


  ctx.fillRect(
    width / 2 - 4,
    height / 2 - 32,
    8,
    22
  );


  /* BODY */

  ctx.fillStyle =
    color;

  ctx.fillRect(
    -width / 2,
    -height / 2,
    width,
    height
  );


  /* WINDOW */

  ctx.fillStyle =
    "#a9e6ff";

  ctx.fillRect(
    -width * .30,
    -height * .28,
    width * .60,
    height * .22
  );


  /* LIGHT */

  ctx.fillStyle =
    "#ffffff";

  ctx.fillRect(
    -width * .32,
    height * .23,
    width * .64,
    6
  );


  /* BOSS BORDER */

  if (
    isBoss
  ) {

    ctx.strokeStyle =
      "#ffb000";

    ctx.lineWidth = 3;

    ctx.strokeRect(
      -width / 2 - 4,
      -height / 2 - 4,
      width + 8,
      height + 8
    );

  }


  ctx.restore();

}


/* =====================================================
   HUD
===================================================== */

function drawHUD() {

  ctx.fillStyle =
    "rgba(0,0,0,.82)";

  ctx.fillRect(
    0,
    0,
    GAME_WIDTH,
    64
  );


  /* LIVES */

  ctx.textAlign =
    "left";

  ctx.font =
    "bold 21px monospace";

  ctx.fillStyle =
    "#ff3434";

  ctx.fillText(
    "♥".repeat(
      Math.max(
        0,
        lives
      )
    ),
    12,
    25
  );


  /* SCORE */

  ctx.font =
    "bold 15px monospace";

  ctx.fillStyle =
    "#fff";

  ctx.fillText(
    "SCORE " + score,
    12,
    49
  );


  /* LEVEL */

  ctx.textAlign =
    "right";

  ctx.fillText(
    "LEVEL " + level,
    348,
    25
  );


  ctx.fillText(
    Math.ceil(levelTime) +
    "s",
    348,
    49
  );

}


/* =====================================================
   START SCREEN
===================================================== */

function drawStartScreen() {

  ctx.fillStyle =
    "rgba(0,0,0,.76)";

  ctx.fillRect(
    0,
    0,
    GAME_WIDTH,
    GAME_HEIGHT
  );


  ctx.textAlign =
    "center";


  ctx.fillStyle =
    "#ff9d00";

  ctx.font =
    "bold 42px monospace";

  ctx.fillText(
    "RACE CAR",
    180,
    225
  );


  ctx.fillStyle =
    "#fff";

  ctx.font =
    "14px monospace";

  ctx.fillText(
    "TAP KIRI  ←",
    180,
    275
  );

  ctx.fillText(
    "TAP KANAN  →",
    180,
    300
  );


  ctx.fillStyle =
    "#888";

  ctx.fillText(
    "HINDARI MOBIL LAWAN",
    180,
    340
  );

}


/* =====================================================
   GAME OVER
===================================================== */

function drawGameOver() {

  ctx.fillStyle =
    "rgba(0,0,0,.78)";

  ctx.fillRect(
    0,
    0,
    GAME_WIDTH,
    GAME_HEIGHT
  );


  ctx.textAlign =
    "center";

  ctx.fillStyle =
    "#ff3333";

  ctx.font =
    "bold 42px monospace";

  ctx.fillText(
    "GAME OVER",
    180,
    285
  );


  ctx.fillStyle =
    "#fff";

  ctx.font =
    "20px monospace";

  ctx.fillText(
    "SCORE: " + score,
    180,
    325
  );

}


/* =====================================================
   WIN
===================================================== */

function drawWin() {

  ctx.fillStyle =
    "rgba(0,70,0,.84)";

  ctx.fillRect(
    0,
    0,
    GAME_WIDTH,
    GAME_HEIGHT
  );


  ctx.textAlign =
    "center";

  ctx.fillStyle =
    "#ffb000";

  ctx.font =
    "bold 46px monospace";

  ctx.fillText(
    "YOU WIN!",
    180,
    285
  );


  ctx.fillStyle =
    "#fff";

  ctx.font =
    "20px monospace";

  ctx.fillText(
    "SCORE: " + score,
    180,
    325
  );

}


/* =====================================================
   DRAW GAME
===================================================== */

function drawGame() {

  drawRoad();


  /* ENEMY */

  for (
    const enemy of enemies
  ) {

    drawCar(
      enemy.x,
      enemy.y,
      enemy.width,
      enemy.height,
      "#d93838"
    );

  }


  /* BOSS */

  if (boss) {

    drawCar(
      boss.x,
      boss.y,
      boss.width,
      boss.height,
      "#792cff",
      true
    );

  }


  /* PLAYER */

  if (
    invincible <= 0 ||
    Math.floor(
      invincible / 6
    ) % 2 === 0
  ) {

    drawCar(
      player.x,
      player.y,
      player.width,
      player.height,
      "#1687ff"
    );

  }


  drawHUD();


  if (
    gameState === "START"
  ) {

    drawStartScreen();

  }


  if (
    gameState === "GAMEOVER"
  ) {

    drawGameOver();

  }


  if (
    gameState === "WIN"
  ) {

    drawWin();

  }

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time) {

  const delta =
    Math.min(
      0.033,
      (time - lastTime) / 1000
    );


  lastTime = time;


  updateGame(delta);

  drawGame();


  if (
    gameState === "PLAYING"
  ) {

    requestAnimationFrame(
      gameLoop
    );

  }

}


/* =====================================================
   BUTTON EVENTS
===================================================== */

startButton.addEventListener(
  "click",
  startGame
);

restartButton.addEventListener(
  "click",
  restartGame
);


/* =====================================================
   INITIAL DRAW
===================================================== */

drawGame();

</script>

</body>
</html>
