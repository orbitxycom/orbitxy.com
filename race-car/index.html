<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OrbitXY Race Car</title>
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:#111;display:flex;align-items:center;justify-content:center;font-family:monospace;overflow:hidden}
#wrap{position:relative}
canvas{display:block;background:#333;width:min(480px,100vw);height:auto;image-rendering:pixelated}
button{font:700 22px monospace;padding:14px 28px;cursor:pointer;border:2px solid #fff;background:#f5a623;color:#111}
#start,#restart{position:absolute;left:50%;transform:translateX(-50%);top:58%;z-index:5}
#restart{display:none}
#hint{position:absolute;bottom:10px;left:0;width:100%;text-align:center;color:#aaa;font-size:13px;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="480" height="600"></canvas>
<button id="start">START</button>
<button id="restart">RESTART</button>
<div id="hint">← → untuk pindah jalur • P untuk pause</div>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const startBtn=document.getElementById("start"),restartBtn=document.getElementById("restart");

const W=480,H=600;
const lanes=[100,240,380], roadLeft=40,roadRight=440;
let state="start",level=1,lives=2,score=0,speed=3,boss=null;
let player={lane:1,x:lanes[1],y:510,w:38,h:70,targetX:lanes[1]};
let enemies=[],keys={};
let last=0,spawnTimer=0,levelTimer=10,invincible=0,roadOffset=0;
let paused=false;

function resetGame(){
 state="playing";level=1;lives=2;score=0;speed=3;levelTimer=10;
 player={lane:1,x:lanes[1],y:510,w:38,h:70,targetX:lanes[1]};
 enemies=[];boss=null;spawnTimer=0;invincible=0;roadOffset=0;paused=false;
 startBtn.style.display="none";restartBtn.style.display="none";
 last=performance.now();requestAnimationFrame(loop);
}

function newEnemy(){
 const lane=Math.floor(Math.random()*3);
 enemies.push({lane,x:lanes[lane],y:-80,w:38,h:70,spd:speed+(Math.random()*1.4)});
}

function rectHit(a,b){
 return a.x-a.w/2<b.x+b.w/2 && a.x+a.w/2>b.x-b.w/2 &&
        a.y-a.h/2<b.y+b.h/2 && a.y+a.h/2>b.y-b.h/2;
}

function loseLife(){
 if(invincible>0)return;
 lives--;invincible=80;
 if(lives<=0){state="over";restartBtn.style.display="block";}
}

function nextLevel(){
 if(level===1){
  level=2;levelTimer=20;speed=4;enemies=[];boss={x:lanes[1],y:-120,w:58,h:92,spd:2.2,target:lanes[1]};
 }else{
  state="win";restartBtn.style.display="block";
 }
}

function update(dt){
 if(state!=="playing"||paused)return;
 roadOffset=(roadOffset+speed*dt*60)%40;
 if(invincible>0)invincible-=dt*60;

 levelTimer-=dt;
 if(levelTimer<=0){nextLevel();return;}

 spawnTimer-=dt;
 if(spawnTimer<=0){
  newEnemy();
  spawnTimer=level===1?0.75:0.58;
 }

 player.x+=(player.targetX-player.x)*Math.min(1,dt*12);

 enemies.forEach(e=>e.y+=e.spd*dt*60);
 enemies=enemies.filter(e=>{
  if(e.y>H+100){score++;return false}
  if(rectHit(player,e)){loseLife();return false}
  return true;
 });

 if(level===2&&boss){
  boss.y+=boss.spd*dt*60;
  if(boss.y>H+120)boss.y=-120;
  if(player.lane<Math.round((lanes.indexOf(boss.target))))boss.target=lanes[Math.max(0,player.lane)];
  if(player.lane>Math.round((lanes.indexOf(boss.target))))boss.target=lanes[Math.min(2,player.lane)];
  boss.x+=(boss.target-boss.x)*Math.min(1,dt*3);
  if(rectHit(player,boss))loseLife();
 }
}

function drawCar(x,y,w,h,main,glass="#bde9ff"){
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle="#111";ctx.fillRect(-w*.52,-h*.38,w*.18,h*.25);ctx.fillRect(w*.34,-h*.38,w*.18,h*.25);
 ctx.fillRect(-w*.52,h*.13,w*.18,h*.25);ctx.fillRect(w*.34,h*.13,w*.18,h*.25);
 ctx.fillStyle=main;ctx.fillRect(-w/2,-h/2,w,h);
 ctx.fillStyle=glass;ctx.fillRect(-w*.30,-h*.30,w*.60,h*.22);
 ctx.fillStyle="#fff";ctx.fillRect(-w*.35,h*.22,w*.70,h*.10);
 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#181818";ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#333";ctx.fillRect(40,0,400,H);

 ctx.fillStyle="#666";
 for(let y=-40+roadOffset;y<H;y+=40){ctx.fillRect(195,y,6,20);ctx.fillRect(279,y,6,20)}

 ctx.fillStyle="#e5e5e5";
 for(let y=-40+roadOffset;y<H;y+=40){ctx.fillRect(40,y,8,20);ctx.fillRect(432,y,8,20)}

 enemies.forEach(e=>drawCar(e.x,e.y,e.w,e.h,"#d43b3b"));
 if(boss)drawCar(boss.x,boss.y,boss.w,boss.h,"#7b38ff","#ffd85c");

 if(invincible<=0||Math.floor(invincible/6)%2===0)
  drawCar(player.x,player.y,player.w,player.h,"#1687ff");

 ctx.fillStyle="#111";ctx.fillRect(0,0,W,70);
 ctx.fillStyle="#fff";ctx.font="bold 20px monospace";
 ctx.textAlign="left";ctx.fillText("❤".repeat(Math.max(0,lives)),15,28);
 ctx.fillText("SCORE "+score,15,55);
 ctx.textAlign="right";ctx.fillText("LEVEL "+level,465,28);
 ctx.fillText(Math.ceil(levelTimer)+"s",465,55);

 if(state==="start"){
  overlay();
  ctx.fillStyle="#f5a623";ctx.font="bold 52px monospace";ctx.textAlign="center";
  ctx.fillText("RACE CAR",240,220);
  ctx.fillStyle="#fff";ctx.font="18px monospace";
  ctx.fillText("Hindari mobil lawan",240,270);
  ctx.fillText("Gunakan ← dan →",240,300);
 }
 if(paused&&state==="playing"){
  overlay();ctx.fillStyle="#fff";ctx.font="bold 48px monospace";ctx.textAlign="center";ctx.fillText("PAUSED",240,300);
 }
 if(state==="over"){
  overlay();ctx.fillStyle="#e33";ctx.font="bold 50px monospace";ctx.textAlign="center";ctx.fillText("GAME OVER",240,270);
  ctx.fillStyle="#fff";ctx.font="24px monospace";ctx.fillText("Score: "+score,240,315);
 }
 if(state==="win"){
  overlay();ctx.fillStyle="#f5a623";ctx.font="bold 55px monospace";ctx.textAlign="center";ctx.fillText("YOU WIN!",240,270);
  ctx.fillStyle="#fff";ctx.font="24px monospace";ctx.fillText("Score: "+score,240,315);
 }
}

function overlay(){ctx.fillStyle="rgba(0,0,0,.72)";ctx.fillRect(0,0,W,H)}

function loop(t){
 const dt=Math.min(.033,(t-last)/1000);last=t;
 update(dt);draw();
 if(state==="playing")requestAnimationFrame(loop);
}

startBtn.onclick=resetGame;
restartBtn.onclick=resetGame;

document.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight"," ","p","P"].includes(e.key))e.preventDefault();
 if(state==="start"&&(e.key==="Enter"||e.key===" "))resetGame();
 if(state==="playing"){
  if(e.key==="ArrowLeft"&&player.lane>0){player.lane--;player.targetX=lanes[player.lane]}
  if(e.key==="ArrowRight"&&player.lane<2){player.lane++;player.targetX=lanes[player.lane]}
  if(e.key==="p"||e.key==="P")paused=!paused;
 }
});
draw();
</script>
</body>
</html>
