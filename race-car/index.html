<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OrbitXY Race Car</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #08090c;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: monospace;
}

#gameBox {
  position: relative;
  width: 480px;
  max-width: 100vw;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  background: #222;
  image-rendering: pixelated;
  touch-action: none;
}

.gameButton {
  position: absolute;
  left: 50%;
  top: 58%;
  transform: translate(-50%, -50%);
  padding: 15px 40px;
  border: 3px solid white;
  border-radius: 6px;
  background: #ff9d00;
  color: white;
  font-family: monospace;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  z-index: 10;
}

.gameButton:hover {
  background: #ffbd3c;
}

#restartButton {
  display: none;
}

/* Area sentuh kiri/kanan */
#touchLeft,
#touchRight {
  position: absolute;
  top: 70px;
  bottom: 0;
  width: 50%;
  z-index: 5;
  touch-action: none;
}

#touchLeft {
  left: 0;
}

#touchRight {
  right: 0;
}
</style>
</head>

<body>

<div id="gameBox">

  <canvas id="gameCanvas" width="480" height="600"></canvas>

  <button id="startButton" class="gameButton">
    START
  </button>

  <button id="restartButton" class="gameButton">
    RESTART
  </button>

  <!--
    Tidak ada tombol kiri/kanan.
    Cukup sentuh sisi kiri/kanan layar.
  -->
  <div id="touchLeft"></div>
  <div id="touchRight"></div>

</div>

<script>

/* =========================================
   CANVAS
========================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const startButton =
  document.getElementById("startButton");

const restartButton =
  document.getElementById("restartButton");

const touchLeft =
  document.getElementById("touchLeft");

const touchRight =
  document.getElementById("touchRight");


/* =========================================
   GAME SETTINGS
========================================= */

const WIDTH = 480;
const HEIGHT = 600;

const LANES = [120, 240, 360];

let gameState = "START";

let level = 1;
let score = 0;
let lives = 2;

let speed = 3;

let levelTime = 10;

let lastTime = 0;

let spawnTimer = 0;

let roadOffset = 0;

let invincible = 0;

let enemies = [];

let boss = null;


/* =========================================
   PLAYER
========================================= */

const player = {
  lane: 1,
  x: LANES[1],
  targetX: LANES[1],
  y: 510,
  width: 42,
  height: 72
};


/* =========================================
   START GAME
========================================= */

function startGame() {

  gameState = "PLAYING";

  level = 1;
  score = 0;
  lives = 2;

  speed = 3;
  levelTime = 10;

  enemies = [];
  boss = null;

  spawnTimer = 0;
  invincible = 0;
  roadOffset = 0;

  player.lane = 1;
  player.x = LANES[1];
  player.targetX = LANES[1];

  startButton.style.display = "none";
  restartButton.style.display = "none";

  lastTime = performance.now();

  requestAnimationFrame(gameLoop);
}


/* =========================================
   RESTART
========================================= */

function restartGame() {
  startGame();
}


/* =========================================
   MOVE LEFT
========================================= */

function moveLeft() {

  if (gameState !== "PLAYING")
    return;

  if (player.lane > 0) {

    player.lane--;

    player.targetX =
      LANES[player.lane];

  }
}


/* =========================================
   MOVE RIGHT
========================================= */

function moveRight() {

  if (gameState !== "PLAYING")
    return;

  if (player.lane < 2) {

    player.lane++;

    player.targetX =
      LANES[player.lane];

  }
}


/* =========================================
   KEYBOARD PC
========================================= */

document.addEventListener("keydown", function(e) {

  if (e.key === "ArrowLeft") {

    e.preventDefault();

    moveLeft();
  }

  if (e.key === "ArrowRight") {

    e.preventDefault();

    moveRight();
  }

  if (
    e.key === "Enter" &&
    gameState === "START"
  ) {

    startGame();
  }

  if (
    e.key === "Enter" &&
    (
      gameState === "GAMEOVER" ||
      gameState === "WIN"
    )
  ) {

    restartGame();
  }

});


/* =========================================
   SENTUH KIRI
========================================= */

function touchLeftScreen(e) {

  e.preventDefault();

  if (gameState !== "PLAYING")
    return;

  moveLeft();
}


/* =========================================
   SENTUH KANAN
========================================= */

function touchRightScreen(e) {

  e.preventDefault();

  if (gameState !== "PLAYING")
    return;

  moveRight();
}


/* =========================================
   TOUCH EVENTS
========================================= */

touchLeft.addEventListener(
  "touchstart",
  touchLeftScreen,
  { passive: false }
);

touchRight.addEventListener(
  "touchstart",
  touchRightScreen,
  { passive: false }
);


/* =========================================
   MOUSE TEST
   PC bisa klik kiri/kanan canvas
========================================= */

canvas.addEventListener(
  "click",
  function(e) {

    if (gameState !== "PLAYING")
      return;

    const rect =
      canvas.getBoundingClientRect();

    const x =
      e.clientX - rect.left;

    const realX =
      x * (canvas.width / rect.width);

    if (realX < WIDTH / 2) {

      moveLeft();

    } else {

      moveRight();

    }

  }
);


/* =========================================
   BUTTONS
========================================= */

startButton.addEventListener(
  "click",
  startGame
);

restartButton.addEventListener(
  "click",
  restartGame
);


/* =========================================
   CREATE ENEMY
========================================= */

function createEnemy() {

  const lane =
    Math.floor(Math.random() * 3);

  enemies.push({

    lane: lane,

    x: LANES[lane],

    y: -100,

    width: 42,

    height: 72,

    speed:
      speed + Math.random() * 1.5

  });

}


/* =========================================
   CREATE BOSS
========================================= */

function createBoss() {

  boss = {

    x: LANES[1],

    targetX: LANES[1],

    y: -130,

    width: 62,

    height: 95,

    speed: 2.2

  };

}


/* =========================================
   COLLISION
========================================= */

function collision(a, b) {

  return (

    a.x - a.width / 2 <
      b.x + b.width / 2 &&

    a.x + a.width / 2 >
      b.x - b.width / 2 &&

    a.y - a.height / 2 <
      b.y + b.height / 2 &&

    a.y + a.height / 2 >
      b.y - b.height / 2

  );

}


/* =========================================
   LOSE LIFE
========================================= */

function loseLife() {

  if (invincible > 0)
    return;

  lives--;

  invincible = 80;

  if (lives <= 0) {

    gameState = "GAMEOVER";

    restartButton.style.display =
      "block";

  }

}


/* =========================================
   UPDATE GAME
========================================= */

function updateGame(delta) {

  if (gameState !== "PLAYING")
    return;


  /* PLAYER */

  player.x +=
    (player.targetX - player.x) *
    Math.min(1, delta * 12);


  /* INVINCIBLE */

  if (invincible > 0) {

    invincible -=
      delta * 60;

  }


  /* ROAD */

  roadOffset +=
    speed * delta * 60;

  if (roadOffset >= 40)
    roadOffset = 0;


  /* TIMER */

  levelTime -= delta;


  if (levelTime <= 0) {

    if (level === 1) {

      level = 2;

      levelTime = 20;

      speed = 4;

      enemies = [];

      createBoss();

    }

    else {

      gameState = "WIN";

      restartButton.style.display =
        "block";

      return;

    }

  }


  /* SPAWN */

  spawnTimer -= delta;

  if (spawnTimer <= 0) {

    createEnemy();

    spawnTimer =
      level === 1
      ? 0.8
      : 0.6;

  }


  /* ENEMIES */

  for (
    let i = enemies.length - 1;
    i >= 0;
    i--
  ) {

    const enemy =
      enemies[i];

    enemy.y +=
      enemy.speed *
      delta *
      60;


    if (enemy.y > HEIGHT + 100) {

      enemies.splice(i, 1);

      score++;

      continue;

    }


    if (
      collision(player, enemy)
    ) {

      enemies.splice(i, 1);

      loseLife();

    }

  }


  /* BOSS */

  if (boss) {

    boss.y +=
      boss.speed *
      delta *
      60;


    if (
      boss.y >
      HEIGHT + 150
    ) {

      boss.y = -150;

    }


    boss.targetX =
      LANES[player.lane];


    boss.x +=
      (boss.targetX - boss.x) *
      delta * 2;


    if (
      collision(player, boss)
    ) {

      loseLife();

    }

  }

}


/* =========================================
   ROAD
========================================= */

function drawRoad() {

  ctx.fillStyle = "#151515";

  ctx.fillRect(
    0,
    0,
    WIDTH,
    HEIGHT
  );


  ctx.fillStyle = "#333";

  ctx.fillRect(
    40,
    0,
    400,
    HEIGHT
  );


  /* ROAD EDGE */

  ctx.fillStyle = "#eeeeee";

  ctx.fillRect(
    40,
    0,
    7,
    HEIGHT
  );

  ctx.fillRect(
    433,
    0,
    7,
    HEIGHT
  );


  /* LANE DIVIDERS */

  for (
    let y = -40 + roadOffset;
    y < HEIGHT;
    y += 40
  ) {

    ctx.fillRect(
      196,
      y,
      6,
      22
    );

    ctx.fillRect(
      278,
      y,
      6,
      22
    );

  }

}


/* =========================================
   CAR
========================================= */

function drawCar(
  x,
  y,
  width,
  height,
  color,
  bossCar = false
) {

  ctx.save();

  ctx.translate(
    x,
    y
  );


  /* WHEELS */

  ctx.fillStyle = "#111";

  ctx.fillRect(
    -width / 2 - 5,
    -height / 2 + 10,
    10,
    25
  );

  ctx.fillRect(
    width / 2 - 5,
    -height / 2 + 10,
    10,
    25
  );

  ctx.fillRect(
    -width / 2 - 5,
    height / 2 - 35,
    10,
    25
  );

  ctx.fillRect(
    width / 2 - 5,
    height / 2 - 35,
    10,
    25
  );


  /* BODY */

  ctx.fillStyle = color;

  ctx.fillRect(
    -width / 2,
    -height / 2,
    width,
    height
  );


  /* WINDOW */

  ctx.fillStyle = "#9edfff";

  ctx.fillRect(
    -width * 0.3,
    -height * 0.28,
    width * 0.6,
    height * 0.23
  );


  /* LIGHT */

  ctx.fillStyle = "#fff";

  ctx.fillRect(
    -width * 0.35,
    height * 0.23,
    width * 0.7,
    7
  );


  /* BOSS BORDER */

  if (bossCar) {

    ctx.strokeStyle =
      "#ffb000";

    ctx.lineWidth = 4;

    ctx.strokeRect(
      -width / 2 - 4,
      -height / 2 - 4,
      width + 8,
      height + 8
    );

  }

  ctx.restore();

}


/* =========================================
   HUD
========================================= */

function drawHUD() {

  ctx.fillStyle =
    "rgba(0,0,0,.8)";

  ctx.fillRect(
    0,
    0,
    WIDTH,
    70
  );


  ctx.fillStyle =
    "#ff3333";

  ctx.font =
    "bold 24px monospace";

  ctx.textAlign =
    "left";

  ctx.fillText(
    "♥".repeat(
      Math.max(0, lives)
    ),
    15,
    28
  );


  ctx.fillStyle =
    "#fff";

  ctx.font =
    "bold 18px monospace";

  ctx.fillText(
    "SCORE: " + score,
    15,
    55
  );


  ctx.textAlign =
    "right";

  ctx.fillText(
    "LEVEL " + level,
    465,
    28
  );


  ctx.fillText(
    Math.ceil(levelTime) + "s",
    465,
    55
  );

}


/* =========================================
   START SCREEN
========================================= */

function drawStartScreen() {

  ctx.fillStyle =
    "rgba(0,0,0,.72)";

  ctx.fillRect(
    0,
    0,
    WIDTH,
    HEIGHT
  );


  ctx.textAlign =
    "center";

  ctx.fillStyle =
    "#ff9d00";

  ctx.font =
    "bold 52px monospace";

  ctx.fillText(
    "RACE CAR",
    240,
    220
  );


  ctx.fillStyle =
    "#fff";

  ctx.font =
    "18px monospace";

  ctx.fillText(
    "SENTUH KIRI = KE KIRI",
    240,
    275
  );

  ctx.fillText(
    "SENTUH KANAN = KE KANAN",
    240,
    305
  );

}


/* =========================================
   GAME OVER
========================================= */

function drawGameOver() {

  ctx.fillStyle =
    "rgba(0,0,0,.75)";

  ctx.fillRect(
    0,
    0,
    WIDTH,
    HEIGHT
  );


  ctx.textAlign =
    "center";

  ctx.fillStyle =
    "#ff3333";

  ctx.font =
    "bold 50px monospace";

  ctx.fillText(
    "GAME OVER",
    240,
    270
  );


  ctx.fillStyle =
    "#fff";

  ctx.font =
    "24px monospace";

  ctx.fillText(
    "Score: " + score,
    240,
    315
  );

}


/* =========================================
   WIN
========================================= */

function drawWin() {

  ctx.fillStyle =
    "rgba(0,70,0,.82)";

  ctx.fillRect(
    0,
    0,
    WIDTH,
    HEIGHT
  );


  ctx.textAlign =
    "center";

  ctx.fillStyle =
    "#ffb000";

  ctx.font =
    "bold 55px monospace";

  ctx.fillText(
    "YOU WIN!",
    240,
    270
  );


  ctx.fillStyle =
    "#fff";

  ctx.font =
    "24px monospace";

  ctx.fillText(
    "Score: " + score,
    240,
    315
  );

}


/* =========================================
   DRAW
========================================= */

function drawGame() {

  drawRoad();


  /* ENEMIES */

  for (
    const enemy of enemies
  ) {

    drawCar(
      enemy.x,
      enemy.y,
      enemy.width,
      enemy.height,
      "#d93636"
    );

  }


  /* BOSS */

  if (boss) {

    drawCar(
      boss.x,
      boss.y,
      boss.width,
      boss.height,
      "#792cff",
      true
    );

  }


  /* PLAYER */

  if (
    invincible <= 0 ||
    Math.floor(
      invincible / 6
    ) % 2 === 0
  ) {

    drawCar(
      player.x,
      player.y,
      player.width,
      player.height,
      "#1687ff"
    );

  }


  drawHUD();


  if (
    gameState === "START"
  ) {

    drawStartScreen();

  }


  if (
    gameState === "GAMEOVER"
  ) {

    drawGameOver();

  }


  if (
    gameState === "WIN"
  ) {

    drawWin();

  }

}


/* =========================================
   GAME LOOP
========================================= */

function gameLoop(time) {

  const delta =
    Math.min(
      0.033,
      (time - lastTime) / 1000
    );

  lastTime = time;

  updateGame(delta);

  drawGame();


  if (
    gameState === "PLAYING"
  ) {

    requestAnimationFrame(
      gameLoop
    );

  }

}


/* =========================================
   INITIAL
========================================= */

drawGame();

</script>

</body>
</html>
