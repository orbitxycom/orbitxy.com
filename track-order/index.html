<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Track Order — orbitxy.com</title>
<link rel="icon" type="image/png" href="https://orbitxy.com/orbitxy.com.png">
<link rel="apple-touch-icon" href="https://orbitxy.com/orbitxy.com.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Ubuntu+Mono:ital,wght@0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000000;--bg1:#0a0a0a;--bg2:#121212;--bg3:#1a1a1a;
  --line:#2E2E2E;--line2:#3a3a3a;
  --em:#a78bfa;--em-rgb:167,139,250;
  --grn:#4ade80;--grn-rgb:74,222,128;
  --red:#f87171;--red-rgb:248,113,113;
  --yel:#fbbf24;--yel-rgb:251,191,36;
  --t1:#ffffff;--t2:#c4c4c4;--t3:#8a8a8a;--t4:rgba(255,255,255,.07);
  --font:'DM Sans',system-ui,sans-serif;--rs:4px;
}
html,body{min-height:100vh;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:14px;line-height:1.5}
body{background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:50px 50px}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:2px}

.notif{position:fixed;top:1rem;left:50%;transform:translateX(-50%) translateY(-12px);display:flex;align-items:center;gap:.4rem;padding:.52rem .95rem .52rem .68rem;border-radius:4px;font-size:.72rem;font-weight:600;z-index:99999;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:min(360px,90vw);backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.7)}
.notif.show{opacity:1;transform:translateX(-50%) translateY(0)}
.notif.info{background:rgba(0,0,0,.97);border:1px solid rgba(255,255,255,.1);color:var(--t1)}
.notif.err{background:rgba(0,0,0,.97);border:1px solid rgba(var(--red-rgb),.35);color:var(--red)}

.nav{height:46px;background:rgba(0,0,0,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.6rem;padding:0 1.1rem;position:sticky;top:0;z-index:50}
.nav-logo{display:flex;align-items:center;gap:9px;font-size:.9rem;font-weight:700;color:var(--t1);text-decoration:none;flex-shrink:0}
.nav-r{display:flex;align-items:center;gap:.4rem;margin-left:auto}
.nav-btn{font-size:.68rem;font-weight:600;color:var(--t2);background:var(--bg2);border:1px solid var(--line2);border-radius:var(--rs);padding:.3rem .75rem;text-decoration:none}

.wrap{max-width:640px;margin:0 auto;padding:1.5rem 1.1rem 4rem}
.page-title{font-size:1.15rem;font-weight:700;margin-bottom:.2rem}
.page-sub{font-size:.72rem;color:var(--t3);margin-bottom:1.3rem}

.filter-row{display:flex;gap:.35rem;overflow-x:auto;padding-bottom:.35rem;margin-bottom:1.1rem;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.f-chip{flex-shrink:0;font-family:var(--font);font-size:.68rem;font-weight:600;padding:.4rem .85rem;border-radius:var(--rs);border:1px solid var(--line);background:transparent;color:var(--t3);cursor:pointer;transition:all .15s;white-space:nowrap}
.f-chip:hover{border-color:var(--line2);color:var(--t2)}
.f-chip.on{border-color:rgba(var(--em-rgb),.4);background:rgba(var(--em-rgb),.08);color:var(--em)}

.order-list{display:flex;flex-direction:column;gap:.6rem}
.order-card{background:var(--bg1);border:1px solid var(--line);border-radius:var(--rs);padding:.85rem .95rem;cursor:pointer;transition:border-color .15s,transform .15s}
.order-card:hover{border-color:var(--line2);transform:translateY(-1px)}
.order-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.6rem;margin-bottom:.5rem}
.order-prod{font-size:.8rem;font-weight:700;color:var(--t1);line-height:1.35}
.order-id{font-size:.6rem;color:var(--t3);font-family:'Ubuntu Mono',monospace;margin-top:.2rem}
.order-badge{flex-shrink:0;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:.2rem .55rem;border-radius:4px;white-space:nowrap}
.order-badge.pending{background:rgba(var(--yel-rgb),.12);color:var(--yel);border:1px solid rgba(var(--yel-rgb),.25)}
.order-badge.paid{background:rgba(var(--grn-rgb),.12);color:var(--grn);border:1px solid rgba(var(--grn-rgb),.25)}
.order-badge.expired,.order-badge.failed{background:rgba(var(--red-rgb),.12);color:var(--red);border:1px solid rgba(var(--red-rgb),.25)}
.order-bottom{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding-top:.5rem;border-top:1px solid var(--line)}
.order-date{font-size:.62rem;color:var(--t3)}
.order-total{font-size:.82rem;font-weight:800;color:var(--em)}

.empty-state{text-align:center;padding:3.5rem 1rem;color:var(--t3)}
.empty-state svg{width:38px;height:38px;margin-bottom:.8rem;opacity:.5}
.empty-state p{font-size:.75rem;margin-bottom:1rem}
.empty-state a{display:inline-block;font-size:.72rem;font-weight:700;color:var(--em);text-decoration:none;border:1px solid rgba(var(--em-rgb),.35);background:rgba(var(--em-rgb),.08);padding:.5rem 1.1rem;border-radius:var(--rs)}

.skel{border-radius:var(--rs);background:linear-gradient(90deg,var(--bg1) 25%,var(--bg2) 50%,var(--bg1) 75%);background-size:400% 100%;animation:shimmer 1.5s ease infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-card{height:78px;margin-bottom:.6rem}

.page-footer{text-align:center;padding:1.1rem 1rem;font-size:.64rem;color:var(--t3)}
</style>
</head>
<body>

<div class="notif" id="notif"><span id="notifMsg"></span></div>

<nav class="nav">
  <a href="/dashboard/" class="nav-logo">
    <span aria-hidden="true" oncontextmenu="return false" draggable="false" style="display:inline-block;width:26px;height:26px;border-radius:6px;flex-shrink:0;background-image:url('https://orbitxy.com/orbitxy.com.png');background-size:cover;background-position:center;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;pointer-events:none"></span>
    <span>orbitxy.com</span>
  </a>
  <div class="nav-r">
    <a href="/dashboard/" class="nav-btn">Kembali</a>
  </div>
</nav>

<div class="wrap">
  <div class="page-title">Track Order</div>
  <div class="page-sub">Semua transaksi yang pernah kamu buat di akun ini.</div>

  <div class="filter-row" id="filterRow">
    <button class="f-chip on" data-f="all">Semua</button>
    <button class="f-chip" data-f="pending">Menunggu</button>
    <button class="f-chip" data-f="paid">Lunas</button>
    <button class="f-chip" data-f="expired">Kedaluwarsa</button>
    <button class="f-chip" data-f="failed">Gagal</button>
  </div>

  <div id="listWrap">
    <div class="skel skel-card"></div>
    <div class="skel skel-card"></div>
    <div class="skel skel-card"></div>
  </div>
</div>

<footer class="page-footer">&copy; <span id="ftYear"></span> orbitxy.com</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
document.getElementById('ftYear').textContent = new Date().getFullYear();

var supabaseClient;
try{
  supabaseClient = supabase.createClient(
    'https://ygjpwaftccewntwwoixs.supabase.co',
    'sb_publishable_4IdyoPpEW-It9IWLZOrSAQ_WuumXkl9'
  );
}catch(e){ console.error('Gagal memuat Supabase:', e); }

function idr(n){var v=Number(n);if(!isFinite(v)||isNaN(v))v=0;return 'Rp'+v.toLocaleString('id-ID');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');}

var _notifT=null;
function notify(msg,type){
  var n=document.getElementById('notif'),msgEl=document.getElementById('notifMsg');
  n.className='notif '+(type||'info'); msgEl.textContent=msg;
  n.classList.add('show'); if(_notifT)clearTimeout(_notifT); _notifT=setTimeout(function(){n.classList.remove('show');},3200);
}

function formatDateWIB(iso){
  if(!iso) return '-';
  try{
    return new Intl.DateTimeFormat('id-ID',{
      day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit',
      timeZone:'Asia/Jakarta'
    }).format(new Date(iso)) + ' WIB';
  }catch(e){ return '-'; }
}

var STATUS_LABEL = {
  pending: '🕐 Menunggu',
  paid: '✓ Lunas',
  expired: '✕ Kedaluwarsa',
  failed: '✕ Gagal'
};

var allOrders = [];
var activeFilter = 'all';

function renderList(){
  var wrap = document.getElementById('listWrap');
  var filtered = activeFilter === 'all' ? allOrders : allOrders.filter(function(o){ return o.status === activeFilter; });

  if(!filtered.length){
    wrap.innerHTML =
      '<div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h6"/></svg>' +
        '<p>' + (activeFilter==='all' ? 'Belum ada riwayat pemesanan.' : 'Gak ada pesanan dengan status ini.') + '</p>' +
        '<a href="/dashboard/">Mulai Belanja</a>' +
      '</div>';
    return;
  }

  wrap.innerHTML = filtered.map(function(o){
    var status = o.status || 'pending';
    return '<div class="order-card" data-id="'+esc(o.id)+'">' +
      '<div class="order-top">' +
        '<div>' +
          '<div class="order-prod">'+esc(o.product_name||'Produk')+'</div>' +
          '<div class="order-id">'+esc(o.id)+'</div>' +
        '</div>' +
        '<div class="order-badge '+status+'">'+(STATUS_LABEL[status]||status)+'</div>' +
      '</div>' +
      '<div class="order-bottom">' +
        '<div class="order-date">'+formatDateWIB(o.created_at)+'</div>' +
        '<div class="order-total">'+idr(o.total)+'</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

document.getElementById('listWrap').addEventListener('click', function(e){
  var card = e.target.closest('.order-card');
  if(!card) return;
  window.location.href = '/bayar/?id=' + encodeURIComponent(card.dataset.id);
});

document.getElementById('filterRow').addEventListener('click', function(e){
  var btn = e.target.closest('.f-chip');
  if(!btn) return;
  activeFilter = btn.dataset.f;
  document.querySelectorAll('.f-chip').forEach(function(b){ b.classList.toggle('on', b === btn); });
  renderList();
});

async function init(){
  if(!supabaseClient){ notify('Gagal memuat sistem','err'); return; }

  var { data: authData } = await supabaseClient.auth.getUser();
  var user = authData ? authData.user : null;
  if(!user){
    window.location.href = '/login/?returnUrl=' + encodeURIComponent('/track-order/');
    return;
  }

  try{
    var { data: orders, error } = await supabaseClient
      .from('orders')
      .select('id, product_name, status, amount, fee, total, created_at')
      .order('created_at', { ascending: false });

    if(error) throw error;

    allOrders = orders || [];
    renderList();
  }catch(err){
    console.error('Gagal memuat riwayat:', err);
    document.getElementById('listWrap').innerHTML =
      '<div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
        '<p>Gagal memuat riwayat pemesanan.</p>' +
      '</div>';
    notify('Gagal memuat riwayat pemesanan','err');
  }
}

init();
</script>
</body>
</html>
