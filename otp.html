<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect WhatsApp</title>
<style>
  :root{
    --bg:#0b0e0c;
    --panel:#11150f;
    --line:#1f2a20;
    --green:#3ddc84;
    --green-dim:#1f7a4d;
    --text:#c8f0d4;
    --muted:#5f7a68;
    --amber:#e2b93b;
    --red:#e2543b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(61,220,132,0.05) 1px, transparent 0);
    background-size:24px 24px;
    font-family:"JetBrains Mono","Fira Code",ui-monospace,monospace;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .term{
    width:100%;
    max-width:560px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 0 0 1px rgba(61,220,132,0.05), 0 20px 60px rgba(0,0,0,0.5);
    overflow:hidden;
  }
  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    background:#0e1210;
    border-bottom:1px solid var(--line);
  }
  .dot{width:11px;height:11px;border-radius:50%;}
  .dot.r{background:#e2543b44;border:1px solid var(--red);}
  .dot.y{background:#e2b93b44;border:1px solid var(--amber);}
  .dot.g{background:#3ddc8444;border:1px solid var(--green);}
  .titletext{
    margin-left:8px;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.05em;
  }
  .screen{
    padding:22px 20px 24px;
  }
  .prompt-line{
    display:flex;
    gap:8px;
    font-size:13px;
    color:var(--muted);
    margin-bottom:4px;
  }
  .log{
    font-size:13px;
    line-height:1.7;
    min-height:20px;
    margin-bottom:18px;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .log .ok{color:var(--green);}
  .log .warn{color:var(--amber);}
  .log .err{color:var(--red);}
  .log .dim{color:var(--muted);}
  form{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .prefix{
    display:flex;align-items:center;
    padding:0 10px;
    background:#0e1210;
    color:var(--green);
    font-size:14px;
    border-right:1px solid var(--line);
  }
  input[type=text]{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    padding:12px 10px;
  }
  input[type=text]::placeholder{color:var(--muted);}
  button{
    border:none;
    background:var(--green-dim);
    color:#0b0e0c;
    font-family:inherit;
    font-weight:600;
    font-size:13px;
    padding:0 18px;
    cursor:pointer;
    letter-spacing:0.03em;
    transition:background .15s ease;
  }
  button:hover{background:var(--green);}
  button:disabled{background:#2a352d;color:var(--muted);cursor:not-allowed;}
  .pairing{
    margin-top:18px;
    text-align:center;
    display:none;
  }
  .pairing.show{display:block;}
  .pairing-label{font-size:12px;color:var(--muted);margin-bottom:8px;letter-spacing:0.08em;}
  .pairing-code{
    font-size:28px;
    letter-spacing:0.15em;
    color:var(--green);
    font-weight:700;
    padding:14px;
    border:1px dashed var(--green-dim);
    border-radius:6px;
  }
  .cursor{
    display:inline-block;
    width:8px;height:15px;
    background:var(--green);
    margin-left:2px;
    animation:blink 1s step-end infinite;
    vertical-align:middle;
  }
  @keyframes blink{50%{opacity:0;}}
  .footnote{
    margin-top:16px;
    font-size:11px;
    color:var(--muted);
    text-align:center;
  }
</style>
</head>
<body>

  <div class="term">
    <div class="titlebar">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
      <div class="titletext">wa-connect — bash</div>
    </div>

    <div class="screen">
      <div class="prompt-line">$ ./connect-whatsapp.sh</div>
      <div class="log" id="log"><span class="dim">Masukkan nomor WhatsApp (contoh: 6281234567890) lalu tekan Hubungkan.</span><span class="cursor"></span></div>

      <form id="connectForm">
        <span class="prefix">+</span>
        <input type="text" id="phoneInput" placeholder="6281234567890" inputmode="numeric" autocomplete="off">
        <button type="submit" id="connectBtn">Hubungkan</button>
      </form>

      <div class="pairing" id="pairingBox">
        <div class="pairing-label">MASUKKAN KODE INI DI WHATSAPP → PERANGKAT TERTAUT</div>
        <div class="pairing-code" id="pairingCode">- - - - - - - -</div>
      </div>

      <div class="footnote">Backend belum terhubung. Ganti SOCKET_URL di kode untuk mengaktifkan.</div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
  // GANTI dengan URL backend kamu (misal dari Railway/Render), contoh:
  // const SOCKET_URL = "https://wa-bot-kamu.up.railway.app";
  const SOCKET_URL = null; // <- isi ini dulu supaya form berfungsi

  const log = document.getElementById('log');
  const form = document.getElementById('connectForm');
  const phoneInput = document.getElementById('phoneInput');
  const connectBtn = document.getElementById('connectBtn');
  const pairingBox = document.getElementById('pairingBox');
  const pairingCode = document.getElementById('pairingCode');

  function print(text, type){
    log.innerHTML = '<span class="' + (type||'') + '">' + text + '</span><span class="cursor"></span>';
  }

  let socket = null;
  if (SOCKET_URL) {
    socket = io(SOCKET_URL);

    socket.on('connect', () => print('Terhubung ke server. Siap menerima nomor.', 'ok'));
    socket.on('disconnect', () => print('Koneksi ke server terputus.', 'err'));

    socket.on('pairing-code', (code) => {
      pairingCode.textContent = code;
      pairingBox.classList.add('show');
      print('Kode pairing diterima. Masukkan di WhatsApp kamu.', 'ok');
      connectBtn.disabled = false;
      connectBtn.textContent = 'Hubungkan';
    });

    socket.on('wa-status', (status) => {
      if (status === 'connected') {
        print('WhatsApp berhasil terhubung!', 'ok');
        pairingBox.classList.remove('show');
      } else if (status === 'connecting') {
        print('Menghubungkan ke WhatsApp...', 'warn');
      } else if (status === 'failed') {
        print('Gagal terhubung. Coba lagi.', 'err');
        connectBtn.disabled = false;
        connectBtn.textContent = 'Hubungkan';
      }
    });
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const phone = phoneInput.value.trim().replace(/\D/g,'');

    if (!phone || phone.length < 8) {
      print('Nomor tidak valid. Gunakan format 62xxxxxxxxxx.', 'err');
      return;
    }

    if (!socket) {
      print('Backend belum diatur. Isi SOCKET_URL di dalam kode terlebih dahulu.', 'err');
      return;
    }

    connectBtn.disabled = true;
    connectBtn.textContent = 'Menghubungkan...';
    print('Mengirim permintaan pairing untuk +' + phone + ' ...', 'warn');
    socket.emit('request-pairing', { phone: phone });
  });
</script>

</body>
</html>
