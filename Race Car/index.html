<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Race Car</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
  html,body{
    height:100%; overflow:hidden;
    background:#0b0b12;
    font-family:'Courier New', ui-monospace, monospace;
    touch-action:none;
    user-select:none;
  }
  #wrap{
    position:relative;
    width:100%; height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #stage{
    position:relative;
    width:100%;
    height:100%;
    max-width:480px;
    background:#000;
  }
  canvas{ display:block; width:100%; height:100%; }
  #pauseBtn{
    position:absolute;
    top:10px; right:10px;
    width:38px; height:38px;
    border-radius:6px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.2);
    color:#fff;
    font-size:16px;
    cursor:pointer;
    z-index:5;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <button id="pauseBtn">⏸</button>
  </div>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const pauseBtn = document.getElementById('pauseBtn');

  const CW = 480, CH = 640;
  let scale = 1, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    const r = stage.getBoundingClientRect();
    scale = Math.min(r.width / CW, r.height / CH);
    canvas.width = CW * DPR;
    canvas.height = CH * DPR;
    canvas.style.width = (CW*scale) + 'px';
    canvas.style.height = (CH*scale) + 'px';
    canvas.style.position = 'absolute';
    canvas.style.left = '50%';
    canvas.style.top = '50%';
    canvas.style.transform = 'translate(-50%,-50%)';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }

  const ROAD_X = 60, ROAD_W = CW - 120;
  const LANE_W = ROAD_W / 3;
  function laneX(lane){ return ROAD_X + LANE_W*lane + LANE_W/2; }

  const LIVES_START = 2;
  const LEVEL_DURATIONS = [18, 26, 34];
  const INVINCIBLE_FRAMES = 90;
  const CAR_W = 44, CAR_H = 66;

  const STATE = { START:'start', COUNTDOWN:'countdown', PLAYING:'playing', PAUSED:'paused', LEVELUP:'levelup', OVER:'over', WIN:'win' };
  let state = STATE.START;

  let player, opponents, boss, road, lives, score, best, speed, level, levelTimer, countdownVal, levelUpText, levelUpTimer;

  best = parseInt(localStorage.getItem('orbitxy_racecar_best') || '0', 10);

  function makePlayer(){
    return {
      lane: 1, x: laneX(1), y: CH - CAR_H - 40,
      targetX: laneX(1), invincible: 0
    };
  }

  const OPP_COLORS = ['#ff6b35', '#4ea8de', '#ffd23f', '#c77dff', '#4dd699'];

  function makeOpponent(lane, yOff){
    return {
      lane, x: laneX(lane), y: -CAR_H - yOff,
      color: OPP_COLORS[Math.floor(Math.random()*OPP_COLORS.length)]
    };
  }

  function resetOpponents(){
    opponents = [0,1,2].map((lane,i) => makeOpponent(lane, i*180 + Math.random()*80));
  }

  function newGame(){
    player = makePlayer();
    resetOpponents();
    boss = null;
    road = { offset: 0 };
    lives = LIVES_START;
    score = 0;
    speed = 3;
    level = 1;
    levelTimer = LEVEL_DURATIONS[0];
  }

  function startLevel(n){
    level = n;
    levelTimer = LEVEL_DURATIONS[Math.min(n-1, LEVEL_DURATIONS.length-1)];
    lives = LIVES_START;
    player.invincible = 0;
    resetOpponents();
    boss = (n === 2) ? { lane:1, x: laneX(1), targetX: laneX(1), y: -CAR_H-20, tick:0 } : null;
  }

  let countdownTick = 0;
  function beginCountdown(){
    state = STATE.COUNTDOWN;
    countdownVal = 3;
    countdownTick = 0;
  }

  function loseLife(){
    if (player.invincible > 0) return;
    lives--;
    player.invincible = INVINCIBLE_FRAMES;
    if (lives <= 0) endGame(false);
  }

  function endGame(won){
    state = won ? STATE.WIN : STATE.OVER;
    if (Math.floor(score) > best) {
      best = Math.floor(score);
      localStorage.setItem('orbitxy_racecar_best', String(best));
    }
  }

  function triggerLevelUp(){
    state = STATE.LEVELUP;
    levelUpText = 'LEVEL ' + (level+1);
    levelUpTimer = 90;
  }

  function moveLane(dir){
    if (state !== STATE.PLAYING) return;
    player.lane = Math.max(0, Math.min(2, player.lane + dir));
    player.targetX = laneX(player.lane);
  }

  function handleTap(clientX){
    if (state === STATE.START) { beginCountdown(); return; }
    if (state === STATE.OVER || state === STATE.WIN) { newGame(); beginCountdown(); return; }
    if (state !== STATE.PLAYING) return;
    const r = stage.getBoundingClientRect();
    const relX = (clientX - r.left) / r.width;
    moveLane(relX < 0.5 ? -1 : 1);
  }

  let dragStartX = null;
  stage.addEventListener('mousedown', e => { dragStartX = e.clientX; });
  stage.addEventListener('mouseup', e => {
    if (dragStartX===null) return;
    const dx = e.clientX - dragStartX;
    if (Math.abs(dx) > 30) moveLane(dx>0?1:-1);
    else handleTap(e.clientX);
    dragStartX = null;
  });
  stage.addEventListener('touchstart', e => { dragStartX = e.touches[0].clientX; }, {passive:true});
  stage.addEventListener('touchend', e => {
    if (dragStartX===null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - dragStartX;
    if (Math.abs(dx) > 30) moveLane(dx>0?1:-1);
    else handleTap(t.clientX);
    dragStartX = null;
  }, {passive:true});

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key==='a') moveLane(-1);
    if (e.key === 'ArrowRight' || e.key==='d') moveLane(1);
    if (e.key === 'p' || e.key === 'P') togglePause();
    if (e.key === ' ' || e.key === 'Enter') {
      if (state === STATE.START) beginCountdown();
      else if (state === STATE.OVER || state === STATE.WIN) { newGame(); beginCountdown(); }
    }
  });

  function togglePause(){
    if (state === STATE.PLAYING) state = STATE.PAUSED;
    else if (state === STATE.PAUSED) state = STATE.PLAYING;
  }
  pauseBtn.addEventListener('click', togglePause);

  function aabb(ax,ay,aw,ah, bx,by,bw,bh){
    return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
  }

  function update(dt){
    if (state !== STATE.PLAYING) return;

    player.x += (player.targetX - player.x) * 0.22;
    if (player.invincible > 0) player.invincible--;

    road.offset = (road.offset + speed*2) % 40;

    speed = Math.min(9, speed + 0.0018);
    score += speed * 0.05;

    opponents.forEach(o => {
      o.y += speed;
      if (o.y > CH + 30) {
        o.lane = Math.floor(Math.random()*3);
        o.x = laneX(o.lane);
        o.y = -CAR_H - Math.random()*160;
        o.color = OPP_COLORS[Math.floor(Math.random()*OPP_COLORS.length)];
        score += 1;
      }
      if (aabb(player.x-CAR_W/2+8, player.y+6, CAR_W-16, CAR_H-12, o.x-CAR_W/2+8, o.y+6, CAR_W-16, CAR_H-12)) {
        loseLife();
      }
    });

    if (boss) {
      boss.y += speed * 0.55;
      if (boss.y > CH + 40) boss.y = -CAR_H - 30;
      boss.tick++;
      if (boss.tick > 65) {
        boss.tick = 0;
        if (player.lane < boss.lane) boss.lane--;
        else if (player.lane > boss.lane) boss.lane++;
        boss.targetX = laneX(boss.lane);
      }
      boss.x += (boss.targetX - boss.x) * 0.06;
      const bw = CAR_W*1.6, bh = CAR_H*1.3;
      if (aabb(player.x-CAR_W/2+8, player.y+6, CAR_W-16, CAR_H-12, boss.x-bw/2+10, boss.y+10, bw-20, bh-20)) {
        loseLife();
        boss.y = -CAR_H - 30;
      }
    }

    levelTimer -= dt;
    if (levelTimer <= 0) {
      if (level >= LEVEL_DURATIONS.length) {
        endGame(true);
      } else {
        triggerLevelUp();
      }
    }
  }

  function updateCountdown(){
    countdownTick++;
    if (countdownTick >= 45) {
      countdownTick = 0;
      countdownVal--;
      if (countdownVal <= 0) state = STATE.PLAYING;
    }
  }

  function updateLevelUp(){
    levelUpTimer--;
    if (levelUpTimer <= 0) {
      startLevel(level+1);
      state = STATE.PLAYING;
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawCar(cx, cy, w, h, body, blink){
    if (blink) return;
    const x = cx - w/2, y = cy;
    ctx.fillStyle = body;
    roundRect(x, y, w, h, w*0.22);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    roundRect(x+w*0.16, y+h*0.10, w*0.68, h*0.22, w*0.1);
    ctx.fill();
    roundRect(x+w*0.16, y+h*0.66, w*0.68, h*0.18, w*0.1);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(x+w*0.05, y+h*0.35, w*0.1, h*0.18);
    ctx.fillRect(x+w*0.85, y+h*0.35, w*0.1, h*0.18);
  }

  function drawRoad(){
    ctx.fillStyle = '#151518';
    ctx.fillRect(0,0,CW,CH);
    ctx.fillStyle = '#26262c';
    ctx.fillRect(ROAD_X, 0, ROAD_W, CH);

    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 3;
    ctx.setLineDash([22,20]);
    ctx.lineDashOffset = -road.offset;
    for (let i=1;i<3;i++){
      const x = ROAD_X + LANE_W*i;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CH); ctx.stroke();
    }
    ctx.setLineDash([]);

    ctx.strokeStyle = 'rgba(166,225,61,0.55)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(ROAD_X,0); ctx.lineTo(ROAD_X,CH);
    ctx.moveTo(ROAD_X+ROAD_W,0); ctx.lineTo(ROAD_X+ROAD_W,CH);
    ctx.stroke();
  }

  function drawHUD(){
    ctx.save();
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#ff5c6a';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('\u2665'.repeat(Math.max(0,lives)), 14, 14);

    ctx.fillStyle = '#a6e13d';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'right';
    ctx.fillText('SKOR ' + Math.floor(score), CW-14, 14);
    ctx.fillStyle = '#8a8a9a';
    ctx.font = '12px monospace';
    ctx.fillText('TERBAIK ' + best, CW-14, 34);

    ctx.fillStyle = '#eee';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL ' + level, CW/2, 14);
    ctx.fillStyle = levelTimer < 4 ? '#ff5c6a' : '#8a8a9a';
    ctx.fillText(Math.ceil(levelTimer) + 's', CW/2, 34);

    if (boss) {
      ctx.fillStyle = '#ff8a2a';
      ctx.font = 'bold 16px monospace';
      ctx.fillText('\u26a0 BOSS!', CW/2, 56);
    }
    ctx.restore();
  }

  function centerText(lines, yStart, colorDefault, sizeDefault){
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    lines.forEach((line, i) => {
      const size = line.size || sizeDefault || 16;
      ctx.font = (line.bold? 'bold ':'') + size + 'px monospace';
      ctx.fillStyle = line.color || colorDefault || '#fff';
      ctx.fillText(line.text, CW/2, yStart + i*size*1.6);
    });
  }

  function drawOverlay(alpha){
    ctx.fillStyle = 'rgba(0,0,0,' + alpha + ')';
    ctx.fillRect(0,0,CW,CH);
  }

  function draw(){
    drawRoad();

    if (state === STATE.START) {
      centerText([{text:'RACE CAR', size:42, color:'#ffd23f', bold:true}], CH/2 - 140);
      centerText([
        {text:'Geser kiri/kanan untuk pindah lajur', size:14, color:'#cfd6d1'},
        {text:'Hindari mobil lawan & BOSS', size:14, color:'#cfd6d1'},
        {text:'Tekan/klik untuk mulai', size:14, color:'#a6e13d'},
      ], CH/2 - 20);
      return;
    }

    opponents.forEach(o => drawCar(o.x, o.y, CAR_W, CAR_H, o.color));
    if (boss) drawCar(boss.x, boss.y, CAR_W*1.6, CAR_H*1.3, '#e63946', false);

    const blink = player.invincible > 0 && Math.floor(player.invincible/6) % 2 === 0;
    drawCar(player.x, player.y, CAR_W, CAR_H, '#a6e13d', blink);

    drawHUD();

    if (state === STATE.COUNTDOWN) {
      drawOverlay(0.5);
      centerText([{text: countdownVal>0?String(countdownVal):'GO!', size:64, color:'#ffd23f', bold:true}], CH/2);
    }
    if (state === STATE.PAUSED) {
      drawOverlay(0.6);
      centerText([
        {text:'JEDA', size:40, color:'#fff', bold:true},
        {text:'Tekan tombol jeda lagi untuk lanjut', size:14, color:'#aaa'},
      ], CH/2 - 20);
    }
    if (state === STATE.LEVELUP) {
      drawOverlay(0.6);
      centerText([{text: levelUpText, size:40, color:'#ffd23f', bold:true}], CH/2);
    }
    if (state === STATE.OVER) {
      drawOverlay(0.75);
      centerText([
        {text:'TABRAKAN!', size:40, color:'#ff5c6a', bold:true},
        {text:'Skor: ' + Math.floor(score), size:18, color:'#fff'},
        {text:'Tekan/klik untuk main lagi', size:14, color:'#a6e13d'},
      ], CH/2 - 20);
    }
    if (state === STATE.WIN) {
      drawOverlay(0.6);
      centerText([
        {text:'MENANG!', size:40, color:'#a6e13d', bold:true},
        {text:'Skor: ' + Math.floor(score), size:18, color:'#fff'},
        {text:'Tekan/klik untuk main lagi', size:14, color:'#a6e13d'},
      ], CH/2 - 20);
    }
  }

  let lastT = performance.now();
  function loop(t){
    const dt = Math.min(0.05, (t - lastT)/1000);
    lastT = t;

    if (state === STATE.COUNTDOWN) updateCountdown();
    else if (state === STATE.LEVELUP) updateLevelUp();
    else update(dt);

    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
