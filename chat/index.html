<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chat — orbitxy.com</title>
<link rel="icon" type="image/png" href="https://orbitxy.com/orbitxy.com.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0d;--card:#151318;--card2:#1c1a22;--line:#232028;--line2:#2e2a35;
  --purple:#8b5cf6;--purple2:#a855f7;
  --t1:#ffffff;--t2:#c9c6d3;--t3:#77748a;
  --font:'DM Sans',system-ui,sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:14px;overflow:hidden}
body{display:flex;flex-direction:column}

.nav{
  height:52px;flex-shrink:0;display:flex;align-items:center;gap:.7rem;padding:0 .9rem;
  background:rgba(10,10,13,.95);border-bottom:1px solid var(--line);
}
.nav-back{width:34px;height:34px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--t2);cursor:pointer;flex-shrink:0;text-decoration:none}
.nav-back svg{width:16px;height:16px}
.nav-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(160deg,#8b5cf6,#6d28d9);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff;flex-shrink:0}
.nav-info{min-width:0}
.nav-name{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-sub{font-size:.62rem;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.msg-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem .8rem}
.msg-empty{text-align:center;color:var(--t3);font-size:.72rem;padding:3rem 1rem}
.msg-day{text-align:center;font-size:.6rem;color:var(--t3);margin:1rem 0 .6rem}

.bubble-row{display:flex;margin-bottom:.5rem}
.bubble-row.me{justify-content:flex-end}
.bubble{
  max-width:76%;padding:.55rem .8rem;border-radius:16px;font-size:.8rem;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;
}
.bubble-row:not(.me) .bubble{background:var(--card2);border:1px solid var(--line2);border-bottom-left-radius:4px;color:var(--t2)}
.bubble-row.me .bubble{background:linear-gradient(180deg,#a855f7,#8b5cf6);color:#fff;border-bottom-right-radius:4px}
.bubble-time{font-size:.58rem;color:var(--t3);margin-top:.2rem;text-align:right}
.bubble-row.me .bubble-time{color:rgba(255,255,255,.55)}

.compose{
  flex-shrink:0;display:flex;gap:.5rem;align-items:flex-end;
  padding:.7rem .8rem calc(.7rem + env(safe-area-inset-bottom));
  background:rgba(10,10,13,.95);border-top:1px solid var(--line);
}
.compose-inp{
  flex:1;background:var(--card2);border:1px solid var(--line2);border-radius:18px;
  padding:.6rem .95rem;color:#fff;font-family:inherit;font-size:.82rem;outline:none;
  resize:none;max-height:100px;line-height:1.4;
}
.compose-inp:focus{border-color:rgba(168,85,247,.5)}
.compose-inp::placeholder{color:var(--t3)}
.compose-btn{
  flex-shrink:0;width:40px;height:40px;border-radius:50%;border:none;
  background:linear-gradient(180deg,#a855f7,#8b5cf6);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.compose-btn:disabled{opacity:.4;cursor:not-allowed}
.compose-btn svg{width:17px;height:17px}

.center-msg{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;padding:2rem;text-align:center}
.center-msg p{font-size:.78rem;color:var(--t3)}
.center-msg a{font-size:.75rem;font-weight:700;color:var(--purple2);text-decoration:none;border:1px solid rgba(168,85,247,.35);background:rgba(168,85,247,.08);padding:.55rem 1.2rem;border-radius:12px}
</style>
</head>
<body>

<nav class="nav" id="navBar" style="display:none">
  <a href="/tokoreseller/" class="nav-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div class="nav-avatar" id="navAvatar">?</div>
  <div class="nav-info">
    <div class="nav-name" id="navName">…</div>
    <div class="nav-sub" id="navSub"></div>
  </div>
</nav>

<div id="loadingWrap" class="center-msg">
  <p>Memuat percakapan…</p>
</div>

<div id="errorWrap" class="center-msg" style="display:none">
  <p id="errorMsg">Percakapan tidak ditemukan.</p>
  <a href="/tokoreseller/">Kembali ke Toko</a>
</div>

<div id="chatWrap" style="display:none;flex:1;display:none;flex-direction:column;min-height:0">
  <div class="msg-wrap" id="msgWrap">
    <div class="msg-empty" id="msgEmpty" style="display:none">Belum ada pesan. Mulai percakapan sekarang.</div>
    <div id="msgList"></div>
  </div>
  <div class="compose">
    <textarea id="composeInp" class="compose-inp" rows="1" placeholder="Tulis pesan…" maxlength="1000"></textarea>
    <button class="compose-btn" id="sendBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';

var supabaseClient;
try{
  supabaseClient = supabase.createClient(
    'https://ygjpwaftccewntwwoixs.supabase.co',
    'sb_publishable_4IdyoPpEW-It9IWLZOrSAQ_WuumXkl9'
  );
}catch(e){ console.error('Gagal memuat Supabase:', e); }

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');}
function getParam(k){return new URLSearchParams(window.location.search).get(k);}

var chatId = getParam('id');
var currentUser = null;
var chatData = null;
var pollTimer = null;
var lastMsgTime = null;

function showError(msg){
  document.getElementById('loadingWrap').style.display = 'none';
  document.getElementById('chatWrap').style.display = 'none';
  document.getElementById('errorWrap').style.display = 'flex';
  document.getElementById('errorMsg').textContent = msg || 'Percakapan tidak ditemukan.';
}

function formatTime(iso){
  try{
    return new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'}).format(new Date(iso));
  }catch(e){ return ''; }
}
function formatDay(iso){
  try{
    return new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'long',year:'numeric',timeZone:'Asia/Jakarta'}).format(new Date(iso));
  }catch(e){ return ''; }
}

function renderMessages(messages){
  var list = document.getElementById('msgList');
  var empty = document.getElementById('msgEmpty');
  if(!messages || !messages.length){
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  var html = '';
  var lastDay = '';
  messages.forEach(function(m){
    var day = formatDay(m.created_at);
    if(day !== lastDay){
      html += '<div class="msg-day">'+day+'</div>';
      lastDay = day;
    }
    var isMe = m.sender_id === currentUser.id;
    html += '<div class="bubble-row'+(isMe?' me':'')+'">' +
      '<div class="bubble">'+esc(m.message)+'<div class="bubble-time">'+formatTime(m.created_at)+'</div></div>' +
    '</div>';
  });
  list.innerHTML = html;

  var wrap = document.getElementById('msgWrap');
  wrap.scrollTop = wrap.scrollHeight;

  if(messages.length) lastMsgTime = messages[messages.length-1].created_at;
}

async function loadMessages(){
  var { data, error } = await supabaseClient
    .from('chat_messages')
    .select('*')
    .eq('chat_id', chatId)
    .order('created_at', { ascending: true });
  if(error){ console.error('Gagal load pesan:', error); return; }
  renderMessages(data || []);
}

async function pollNewMessages(){
  try{
    var { data, error } = await supabaseClient
      .from('chat_messages')
      .select('*')
      .eq('chat_id', chatId)
      .order('created_at', { ascending: true });
    if(error) return;
    renderMessages(data || []);
  }catch(e){}
}

async function sendMessage(){
  var inp = document.getElementById('composeInp');
  var text = inp.value.trim();
  if(!text) return;

  var btn = document.getElementById('sendBtn');
  btn.disabled = true;
  inp.value = '';
  inp.style.height = 'auto';

  try{
    var { error } = await supabaseClient.from('chat_messages').insert({
      chat_id: chatId,
      sender_id: currentUser.id,
      message: text
    });
    if(error) throw error;

    await supabaseClient.from('chats').update({
      last_message: text,
      last_message_at: new Date().toISOString()
    }).eq('id', chatId);

    await loadMessages();
  }catch(err){
    console.error('Gagal kirim pesan:', err);
    inp.value = text;
    alert('Gagal mengirim pesan');
  }finally{
    btn.disabled = false;
  }
}

document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('composeInp').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
document.getElementById('composeInp').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

async function init(){
  if(!supabaseClient){ showError('Gagal memuat sistem.'); return; }
  if(!chatId){ showError('Link percakapan tidak valid.'); return; }

  var { data: userData } = await supabaseClient.auth.getUser();
  currentUser = userData ? userData.user : null;
  if(!currentUser){
    window.location.href = '/login/?returnUrl=' + encodeURIComponent(window.location.pathname + window.location.search);
    return;
  }

  try{
    var { data: chat, error } = await supabaseClient
      .from('chats')
      .select('*')
      .eq('id', chatId)
      .single();

    if(error || !chat){ showError('Percakapan tidak ditemukan.'); return; }
    if(chat.buyer_id !== currentUser.id && chat.seller_id !== currentUser.id){
      showError('Kamu tidak punya akses ke percakapan ini.');
      return;
    }

    chatData = chat;
    var isBuyer = chat.buyer_id === currentUser.id;
    var counterpartName = isBuyer ? (chat.seller_name || 'Penjual') : (chat.buyer_name || 'Pembeli');

    document.getElementById('navName').textContent = counterpartName;
    document.getElementById('navAvatar').textContent = counterpartName.charAt(0).toUpperCase();
    document.getElementById('navSub').textContent = chat.product_name ? ('Tentang: ' + chat.product_name) : '';
    document.getElementById('navBar').style.display = 'flex';

    await loadMessages();

    document.getElementById('loadingWrap').style.display = 'none';
    document.getElementById('chatWrap').style.display = 'flex';

    pollTimer = setInterval(pollNewMessages, 4000);
  }catch(err){
    console.error('Gagal memuat chat:', err);
    showError('Gagal memuat percakapan.');
  }
}

init();
</script>
</body>
</html>
